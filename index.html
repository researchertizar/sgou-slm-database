<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="description" content="SGOU Programme Browser — Self Learning Material PDFs">
    <meta name="theme-color" content="#1a1714">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SGOU SLM Browser - By Researcher Tizar</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E2N7NJNRQB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-E2N7NJNRQB', {
            'anonymize_ip': true,
            'cookie_flags': 'SameSite=None;Secure'
        });
    </script>
</head>

<body>
    <!-- Offline bar -->
    <div class="offline-bar" id="offlineBar" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
        <span>You are offline &mdash; cached data shown</span>
    </div>

    <!-- Header -->
    <header>
        <div class="header-inner">
            <div class="header-top">
                <div class="header-text">
                    <h1>
                        <svg class="logo" width="36" height="36" viewBox="0 0 512 512" aria-hidden="true">
                            <rect width="512" height="512" rx="108" fill="var(--accent)" />
                            <rect x="72" y="365" width="368" height="10" rx="5" fill="var(--header-text)"
                                opacity=".4" />
                            <text x="256" y="290" font-family="Georgia,serif" font-size="210" font-weight="bold"
                                fill="var(--header-text)" text-anchor="middle" dominant-baseline="central">SG</text>
                        </svg>
                        <span class="title-group">
                            SGOU SLM Browser
                            <span class="credit">by Researcher Tizar</span>
                        </span>
                    </h1>
                    <p>Sree Narayanaguru Open University &mdash; Self Learning Material</p>
                </div>
                <div class="header-actions">
                    <kbd class="kbd-hint" aria-hidden="true">/</kbd>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Sticky controls -->
    <div class="sticky-controls" id="stickyControls">
        <div class="search-wrapper">
            <div class="search-bar">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Search programmes or courses..." autocomplete="off"
                    aria-label="Search">
                <button class="search-clear" id="searchClear" aria-label="Clear">&times;</button>
            </div>
            <div class="recent-searches" id="recentSearches" aria-label="Recent searches"></div>
        </div>
        <div class="controls-row">
            <div class="filters" id="filters" role="group" aria-label="Level filter"></div>
            <div class="view-controls" id="viewControls">
                <button class="view-btn" id="expandAll" aria-label="Expand all">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                    Expand
                </button>
                <button class="view-btn" id="collapseAll" aria-label="Collapse all">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="18 15 12 9 6 15" />
                    </svg>
                    Collapse
                </button>
            </div>
        </div>
        <div class="stats" id="stats" aria-live="polite"></div>
    </div>

    <!-- Main -->
    <main>
        <div class="search-results" id="searchResults" role="region" aria-label="Search results"></div>
        <div class="programme-grid" id="grid" role="list" aria-label="Programmes"></div>
    </main>

    <!-- Back to top -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15" />
        </svg>
    </button>

    <!-- Install banner -->
    <div class="install-banner" id="installBanner" role="complementary">
        <div class="install-inner">
            <div class="install-info">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>Install SLM Browser for offline access</span>
            </div>
            <div class="install-actions">
                <button class="install-btn" id="installBtn">Install</button>
                <button class="install-dismiss" id="installDismiss" aria-label="Dismiss">&times;</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer>
        <span>Course PDFs hosted on SGOU's CDN</span>
        <span class="footer-sep">&middot;</span>
        <span class="footer-count" id="downloadCount"></span>
        <br>
        <span class="footer-credit">
            Built by <strong>Researcher Tizar</strong> &mdash;
            <a href="https://sgou-slm-database.vercel.app/" target="_blank" rel="noopener">SLM Browser</a>
        </span>
    </footer>


    <script src="script.js" defer></script>
</body>

</html>
