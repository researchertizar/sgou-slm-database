  <script src="./pdfjs/pdf.min.js"></script>
  <script>
    (function () {
      'use strict';

      // --- Eye-Comfort Filter Synchronization & Cycling ---
      var container = document.getElementById('viewerContainer');
      var filterBtn = document.getElementById('filterBtn');
      var filterIcon = document.getElementById('filterIcon');
      var toastEl = document.getElementById('readerToast');
      var toastTimer = null;

      var FILTER_MODES = ['normal', 'sepia', 'dark'];
      var FILTER_LABELS = {
        normal: 'Natural Document',
        sepia: 'Warm Sepia (Eye Comfort)',
        dark: 'Night Invert (Dark Mode)'
      };

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 1800);
      }

      function updateFilterUI(mode) {
        if (!container) container = document.getElementById('viewerContainer');
        if (!filterBtn) filterBtn = document.getElementById('filterBtn');
        if (!filterIcon) filterIcon = document.getElementById('filterIcon');
        if (container) {
          container.classList.remove('filter-sepia', 'filter-dark');
          if (mode === 'sepia') {
            container.classList.add('filter-sepia');
          } else if (mode === 'dark') {
            container.classList.add('filter-dark');
          }
        }
        if (filterIcon) {
          if (mode === 'sepia') {
            filterIcon.innerHTML = '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10M6 14h6"/>';
          } else if (mode === 'dark') {
            filterIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
          } else {
            filterIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
          }
        }
        if (filterBtn) {
          if (mode === 'sepia') {
            filterBtn.title = 'Warm Sepia Mode (T)';
          } else if (mode === 'dark') {
            filterBtn.title = 'Night Invert Mode (T)';
          } else {
            filterBtn.title = 'Natural Document Mode (T)';
          }
        }
      }

      function applySavedFilter() {
        var mode = 'normal';
        try { mode = localStorage.getItem('sgou-pdf-filter') || 'normal'; } catch (_) {}
        updateFilterUI(mode);
      }

      function cycleFilterMode() {
        var cur = 'normal';
        try { cur = localStorage.getItem('sgou-pdf-filter') || 'normal'; } catch (_) {}
        var nextIdx = (FILTER_MODES.indexOf(cur) + 1) % FILTER_MODES.length;
        var next = FILTER_MODES[nextIdx];
        try { localStorage.setItem('sgou-pdf-filter', next); } catch (_) {}
        updateFilterUI(next);
        showToast(FILTER_LABELS[next]);
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'sgou-reader-filter-sync', filter: next }, '*');
          }
        } catch (_) {}
      }
      if (filterBtn) filterBtn.addEventListener('click', cycleFilterMode);

      // --- Theme Synchronization & Adaptive Reading Mode ---
      function applyTheme(themeOverride, filterOverride) {
        var params = new URLSearchParams(window.location.search);
        var requestedTheme = themeOverride || params.get('theme');
        var theme = 'light';

        if (requestedTheme === 'dark' || requestedTheme === 'light') {
          theme = requestedTheme;
        } else {
          try {
            theme = localStorage.getItem('sgou-theme-v2') || 'light';
          } catch (_) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);

        // Dynamically synchronize the reading page with the theme
        var targetFilter = filterOverride;
        if (!targetFilter) {
          try { targetFilter = localStorage.getItem('sgou-pdf-filter'); } catch (_) {}
          if (!targetFilter) {
            targetFilter = theme === 'dark' ? 'dark' : 'normal';
          }
        }
        try { localStorage.setItem('sgou-pdf-filter', targetFilter); } catch (_) {}
        updateFilterUI(targetFilter);
      }
      applyTheme();
      window.addEventListener('storage', function () { applyTheme(); });
      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'sgou-theme-change') {
          applyTheme(e.data.theme, e.data.filter);
        } else if (e.data.type === 'sgou-filter-change') {
          if (e.data.filter) {
            try { localStorage.setItem('sgou-pdf-filter', e.data.filter); } catch (_) {}
            updateFilterUI(e.data.filter);
          }
        }
      });

      // --- Fullscreen Dynamic Management ---
      var fullscreenBtn = document.getElementById('fullscreenBtn');
      var fullscreenIcon = document.getElementById('fullscreenIcon');

      function isFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
      }

      function updateFullscreenUI() {
        var full = isFullscreen();
        if (full) {
          // Collapse / Exit fullscreen icon
          fullscreenIcon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
          fullscreenBtn.title = 'Exit fullscreen (F / Esc)';
          fullscreenBtn.setAttribute('aria-label', 'Exit fullscreen');
        } else {
          // Expand / Enter fullscreen icon
          fullscreenIcon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
          fullscreenBtn.title = 'Enter fullscreen (F)';
          fullscreenBtn.setAttribute('aria-label', 'Enter fullscreen');
        }
      }

      function toggleFullscreen() {
        if (!isFullscreen()) {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
          if (req) {
            req.call(el).then(updateFullscreenUI).catch(function () {});
          }
        } else {
          var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
          if (ex) {
            ex.call(document).then(updateFullscreenUI).catch(function () {});
          }
        }
      }

      fullscreenBtn.addEventListener('click', toggleFullscreen);
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (evt) {
        document.addEventListener(evt, updateFullscreenUI);
      });

      if (typeof pdfjsLib === 'undefined') {
        showError('PDF.js rendering engine could not be initialized.');
        return;
      }

      pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.min.js';

      var params = new URLSearchParams(window.location.search);
      var rawFile = params.get('file') || '';
      var docName = params.get('name') || 'Document';

      var loadingOverlay = document.getElementById('loadingOverlay');
      var loadingMsg = document.getElementById('loadingMsg');
      var errorBox = document.getElementById('errorBox');
      var errorMsg = document.getElementById('errorMsg');
      var bottomBar = document.getElementById('bottomBar');
      var pageNumEl = document.getElementById('pageNum');
      var pageCountEl = document.getElementById('pageCount');
      var pageJumpBtn = document.getElementById('pageJumpBtn');
      var readingProgressBar = document.getElementById('readingProgressBar');
      var readingProgressWrap = document.getElementById('readingProgressWrap');

      var jumpModal = document.getElementById('jumpModal');
      var jumpPageInput = document.getElementById('jumpPageInput');
      var jumpScrubber = document.getElementById('jumpScrubber');
      var jumpCancelBtn = document.getElementById('jumpCancelBtn');
      var jumpGoBtn = document.getElementById('jumpGoBtn');

      var pdfDoc = null;
      var totalPages = 0;
      var currentPage = 1;
      var currentScale = 1.0;
      var unscaledPageWidth = 595.28;
      var unscaledPageHeight = 841.89;
      var pageRenders = {};
      var pageWrappers = [];
      var pageObserver = null;

      // Toolbar auto-hide and scroll tracking
      var lastScrollTop = 0;
      var toolbarHidden = false;
      var scrollTicking = false;

      function showError(msg) {
        var spinner = document.querySelector('.spinner');
        if (spinner) spinner.style.display = 'none';
        loadingMsg.style.display = 'none';
        errorBox.style.display = 'flex';
        errorMsg.textContent = msg;
      }

      function resolveFileUrl(url) {
        if (!url) return '';
        if (url.startsWith('blob:') || url.startsWith('data:') || url.startsWith('/') || url.startsWith('./')) {
          return url;
        }
        try {
          if (window.location.origin && url.startsWith(window.location.origin)) {
            return url;
          }
        } catch (_) {}
        return '/api/download?url=' + encodeURIComponent(url) + '&inline=1';
      }

      async function loadDocument() {
        if (!rawFile) {
          showError('No document URL provided.');
          return;
        }

        var spinner = document.querySelector('.spinner');
        if (spinner) spinner.style.display = 'block';
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = 'Loading ' + docName + '\u2026';
        errorBox.style.display = 'none';

        var targetUrl = resolveFileUrl(rawFile);
        var pdfData = null;

        // 1. Check device CacheStorage for instant offline retrieval
        if ('caches' in window) {
          try {
            var cache = await caches.open('sgou-offline-docs');
            var match = await cache.match(rawFile);
            if (!match) {
              match = await cache.match(decodeURIComponent(rawFile));
            }
            if (match) {
              loadingMsg.textContent = 'Reading from device storage\u2026';
              var arrayBuf = await match.arrayBuffer();
              pdfData = new Uint8Array(arrayBuf);
            }
          } catch (cErr) {
            console.warn('[CacheStorage]', cErr);
          }
        }

        // 2. If targetUrl is already a blob URL or data URL, read into ArrayBuffer directly
        if (!pdfData && (targetUrl.startsWith('blob:') || targetUrl.startsWith('data:'))) {
          try {
            var bResp = await fetch(targetUrl);
            var bBuf = await bResp.arrayBuffer();
            pdfData = new Uint8Array(bBuf);
          } catch (bErr) {
            console.warn('[Blob Fetch]', bErr);
          }
        }

        try {
          var docConfig = pdfData
            ? { data: pdfData }
            : {
                url: targetUrl,
                rangeChunkSize: 65536,
                disableAutoFetch: false,
                disableStream: false
              };

          var loadingTask = pdfjsLib.getDocument(docConfig);

          loadingTask.onProgress = function (p) {
            if (p.total > 0) {
              var pct = Math.round((p.loaded / p.total) * 100);
              loadingMsg.textContent = 'Downloading preview: ' + pct + '%';
            }
          };

          pdfDoc = await loadingTask.promise;
        } catch (err) {
          // If proxy stream failed or returned error, fallback directly to raw file URL
          if (!pdfData && targetUrl !== rawFile && rawFile) {
            try {
              console.warn('[PDF Reader] Proxy stream failed, retrying direct URL:', rawFile);
              loadingMsg.textContent = 'Connecting direct preview\u2026';
              var directTask = pdfjsLib.getDocument({
                url: rawFile,
                rangeChunkSize: 65536,
                disableAutoFetch: false,
                disableStream: false
              });
              pdfDoc = await directTask.promise;
            } catch (directErr) {
              console.error('[PDF Reader Direct Error]', directErr);
              showError('Could not load document preview (' + (directErr.message || 'Error') + ')');
              return;
            }
          } else {
            console.error('[PDF Reader Error]', err);
            showError('Could not load document preview (' + (err.message || 'Error') + ')');
            return;
          }
        }

        totalPages = pdfDoc.numPages;
        pageCountEl.textContent = totalPages;

        // Compute initial scale to fit container width cleanly
        var firstPage = await pdfDoc.getPage(1);
        var unscaledViewport = firstPage.getViewport({ scale: 1 });
        unscaledPageWidth = unscaledViewport.width;
        unscaledPageHeight = unscaledViewport.height;

        calculateInitialScale();
        createPagePlaceholders();
        initIntersectionObserver();

        loadingOverlay.classList.add('hidden');

        // Render active page and adjacent page sequentially on initial load
        queuePageRender(1, true);
        if (totalPages >= 2) queuePageRender(2, false);
      }

      var zoomPresetBtn = document.getElementById('zoomPresetBtn');
      var zoomPresetText = document.getElementById('zoomPresetText');
      var zoomInBtn = document.getElementById('zoomInBtn');
      var zoomOutBtn = document.getElementById('zoomOutBtn');
      var activeRenderTasks = {};
      var renderDebounceTimer = null;
      var isTeleporting = false;
      var MIN_SCALE = 0.35;
      var MAX_SCALE = 3.5;

      function getFitHeightScale() {
        var cHeight = container.clientHeight || window.innerHeight;
        var availHeight = Math.max(cHeight - 48, 380);
        return Math.min(Math.max(availHeight / unscaledPageHeight, MIN_SCALE), 2.2);
      }

      function getFitWidthScale() {
        var cWidth = container.clientWidth || window.innerWidth;
        var isDesktop = cWidth >= 840;
        // On desktop widescreen, constrain width to comfortable ergonomic reading width (840px max)
        var targetWidth = isDesktop ? Math.min(cWidth - 48, 840) : Math.max(cWidth - 20, 280);
        return Math.min(Math.max(targetWidth / unscaledPageWidth, MIN_SCALE), 2.5);
      }

      function calculateInitialScale() {
        var cWidth = container.clientWidth || window.innerWidth;
        if (cWidth >= 840) {
          // On desktop, default to Fit Page (Height) so the full A4 page fits cleanly without being blown up!
          currentScale = getFitHeightScale();
        } else {
          // On mobile, default to Fit Width to fill narrow smartphone screens
          currentScale = getFitWidthScale();
        }
        updateZoomUI();
      }

      function updateZoomUI() {
        if (zoomPresetText) {
          zoomPresetText.textContent = Math.round(currentScale * 100) + '%';
        }
        if (zoomPresetBtn) {
          var fitH = getFitHeightScale();
          var isFitH = Math.abs(currentScale - fitH) < 0.08;
          zoomPresetBtn.title = isFitH ? 'Zoom: ' + Math.round(currentScale * 100) + '% (Click for Fit Width)' : 'Zoom: ' + Math.round(currentScale * 100) + '% (Click for Fit Page)';
        }
        if (zoomInBtn) {
          var atMax = currentScale >= MAX_SCALE - 0.02;
          zoomInBtn.disabled = atMax;
          zoomInBtn.setAttribute('aria-disabled', atMax ? 'true' : 'false');
        }
        if (zoomOutBtn) {
          var atMin = currentScale <= MIN_SCALE + 0.02;
          zoomOutBtn.disabled = atMin;
          zoomOutBtn.setAttribute('aria-disabled', atMin ? 'true' : 'false');
        }
      }

      function toggleFitZoom() {
        var fitH = getFitHeightScale();
        var fitW = getFitWidthScale();
        if (Math.abs(currentScale - fitH) < 0.08) {
          applySmoothScale(fitW, null, null, false);
          showToast('Fit to Width (' + Math.round(fitW * 100) + '%)');
        } else {
          applySmoothScale(fitH, null, null, false);
          showToast('Fit to Page (' + Math.round(fitH * 100) + '%)');
        }
      }

      function applySmoothScale(newScale, focalX, focalY, isInteractive) {
        newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);
        var oldScale = currentScale;
        if (Math.abs(newScale - oldScale) < 0.002) return;

        if (isInteractive) {
          container.classList.add('is-zooming-interactive');
        } else {
          container.classList.remove('is-zooming-interactive');
        }

        // Find the specific page under the focal point
        var targetWrap = null;
        var r = null;
        if (typeof focalX === 'number' && typeof focalY === 'number') {
          for (var i = 0; i < pageWrappers.length; i++) {
            var b = pageWrappers[i].getBoundingClientRect();
            if (focalY >= b.top && focalY <= b.bottom) {
              targetWrap = pageWrappers[i];
              r = b;
              break;
            }
          }
        }
        if (!targetWrap && pageWrappers.length > 0) {
          var curIdx = Math.min(Math.max(currentPage - 1, 0), pageWrappers.length - 1);
          targetWrap = pageWrappers[curIdx];
          r = targetWrap.getBoundingClientRect();
        }

        var fractionX = 0.5;
        var fractionY = 0.5;
        if (r && r.width > 0 && r.height > 0 && typeof focalX === 'number' && typeof focalY === 'number') {
          fractionX = Math.min(Math.max((focalX - r.left) / r.width, 0), 1);
          fractionY = Math.min(Math.max((focalY - r.top) / r.height, 0), 1);
        }

        currentScale = newScale;
        updateZoomUI();

        var scaledWidth = Math.floor(unscaledPageWidth * currentScale);
        var scaledHeight = Math.floor(unscaledPageHeight * currentScale);

        // Resize all page wrappers (existing canvases scale smoothly in GPU memory without white flash)
        for (var i = 0; i < pageWrappers.length; i++) {
          var wrap = pageWrappers[i];
          wrap.style.width = scaledWidth + 'px';
          wrap.style.height = scaledHeight + 'px';
        }

        // Keep focal point stationary directly under cursor or fingers
        if (targetWrap && typeof focalX === 'number' && typeof focalY === 'number') {
          var cRect = container.getBoundingClientRect();
          var fx = focalX - cRect.left;
          var fy = focalY - cRect.top;

          var pointInContainerX = targetWrap.offsetLeft + (fractionX * scaledWidth);
          var pointInContainerY = targetWrap.offsetTop + (fractionY * scaledHeight);

          container.scrollLeft = Math.max(0, pointInContainerX - fx);
          container.scrollTop = Math.max(0, pointInContainerY - fy);
        } else {
          var scaleRatio = newScale / oldScale;
          container.scrollLeft = Math.max(0, container.scrollLeft * scaleRatio);
          container.scrollTop = Math.max(0, container.scrollTop * scaleRatio);
        }

        updateReadingProgress();

        // Debounce high-DPI re-rendering once zoom gesture settles
        clearTimeout(renderDebounceTimer);
        renderDebounceTimer = setTimeout(function () {
          container.classList.remove('is-zooming-interactive');
          reRenderVisiblePages();
        }, isInteractive ? 190 : 120);
      }

      function reRenderVisiblePages() {
        for (var p in activeRenderTasks) {
          try { activeRenderTasks[p].cancel(); } catch (_) {}
        }
        activeRenderTasks = {};
        pageRenders = {};
        renderQueue = [];
        var cTop = container.scrollTop;
        var cBottom = cTop + container.clientHeight;

        // Render current active page with highest priority first
        queuePageRender(currentPage, true);

        // Queue other visible adjacent pages in sequential order
        for (var i = 0; i < pageWrappers.length; i++) {
          var wrap = pageWrappers[i];
          var wTop = wrap.offsetTop;
          var wBottom = wTop + wrap.offsetHeight;
          if (wBottom >= cTop - 120 && wTop <= cBottom + 120) {
            var pageNum = i + 1;
            if (pageNum !== currentPage) {
              queuePageRender(pageNum, false);
            }
          }
        }
      }

      function createPagePlaceholders() {
        container.innerHTML = '';
        pageWrappers = [];
        pageRenders = {};

        var scaledWidth = Math.floor(unscaledPageWidth * currentScale);
        var scaledHeight = Math.floor(unscaledPageHeight * currentScale);

        for (var i = 1; i <= totalPages; i++) {
          var wrap = document.createElement('div');
          wrap.className = 'pdf-page-wrap page-placeholder';
          wrap.id = 'pageWrap-' + i;
          wrap.dataset.page = i;
          wrap.style.width = scaledWidth + 'px';
          wrap.style.height = scaledHeight + 'px';
          wrap.innerHTML = '<div class="page-skeleton-pulse"></div><span>Page ' + i + '</span>';

          container.appendChild(wrap);
          pageWrappers.push(wrap);
        }
      }

      function initIntersectionObserver() {
        if (pageObserver) pageObserver.disconnect();

        pageObserver = new IntersectionObserver(function (entries) {
          if (isTeleporting) return;
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              var pageNum = parseInt(entry.target.dataset.page, 10);
              queuePageRender(pageNum, Math.abs(pageNum - currentPage) <= 1);
            }
          });
        }, {
          root: container,
          rootMargin: '600px 0px 600px 0px',
          threshold: 0.01
        });

        pageWrappers.forEach(function (w) { pageObserver.observe(w); });
      }

      function getOptimalRasterScale(scale) {
        var dpr = window.devicePixelRatio || 1;
        var isMobile = (window.innerWidth <= 768) || ('ontouchstart' in window) || (navigator.maxTouchPoints > 1);
        // Guarantee 100% uncompromising, crystal-clear vector sharpness at any magnification.
        // Effective density scales with zoom level * DPR, up to a safe 3.2x ceiling on mobile (4.0x on desktop)
        // to prevent GPU memory crashes while maintaining print-grade typography even at high zoom.
        var maxScale = isMobile ? 3.2 : 4.0;
        var targetScale = Math.min(scale * Math.min(dpr, 2.5), maxScale);
        return Math.max(targetScale, 0.75);
      }

      var renderQueue = [];
      var isProcessingQueue = false;

      function queuePageRender(num, isHighPriority) {
        if (num < 1 || num > totalPages || pageRenders[num]) return;
        if (isHighPriority) {
          renderQueue = renderQueue.filter(function (n) { return n !== num; });
          renderQueue.unshift(num);
        } else if (renderQueue.indexOf(num) === -1) {
          renderQueue.push(num);
        }
        processRenderQueue();
      }

      async function processRenderQueue() {
        if (isProcessingQueue || renderQueue.length === 0) return;
        isProcessingQueue = true;
        while (renderQueue.length > 0) {
          var nextNum = renderQueue.shift();
          if (Math.abs(nextNum - currentPage) <= 2 && !pageRenders[nextNum]) {
            await renderPage(nextNum);
          }
        }
        isProcessingQueue = false;
      }

      async function renderPage(num) {
        if (!pdfDoc || num < 1 || num > totalPages) return;
        if (pageRenders[num]) return;
        pageRenders[num] = true;

        var wrap = document.getElementById('pageWrap-' + num);
        if (!wrap) return;

        try {
          var page = await pdfDoc.getPage(num);
          var rasterScale = getOptimalRasterScale(currentScale);
          var viewport = page.getViewport({ scale: rasterScale });

          var existingCanvas = wrap.querySelector('canvas');
          if (!existingCanvas) {
            // First time rendering: create canvas with opaque context for maximum GPU throughput
            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            wrap.innerHTML = '';
            wrap.appendChild(canvas);
            wrap.classList.remove('page-placeholder');

            if (activeRenderTasks[num]) {
              try { activeRenderTasks[num].cancel(); } catch (_) {}
            }

            var ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
            var renderTask = page.render({
              canvasContext: ctx,
              viewport: viewport,
              intent: 'display'
            });
            activeRenderTasks[num] = renderTask;
            await renderTask.promise;
            delete activeRenderTasks[num];
          } else {
            // Re-rendering existing page (e.g. after zoom change):
            // Double-buffered rendering into off-screen canvas, then seamless atomic swap.
            var newCanvas = document.createElement('canvas');
            newCanvas.width = Math.floor(viewport.width);
            newCanvas.height = Math.floor(viewport.height);
            newCanvas.style.width = '100%';
            newCanvas.style.height = '100%';

            if (activeRenderTasks[num]) {
              try { activeRenderTasks[num].cancel(); } catch (_) {}
            }

            var ctx = newCanvas.getContext('2d', { alpha: false, willReadFrequently: true });
            var renderTask = page.render({
              canvasContext: ctx,
              viewport: viewport,
              intent: 'display'
            });
            activeRenderTasks[num] = renderTask;
            await renderTask.promise;
            delete activeRenderTasks[num];

            // Atomic swap: replace old canvas with the freshly rendered canvas
            if (existingCanvas.parentNode === wrap) {
              wrap.replaceChild(newCanvas, existingCanvas);
            }
          }
        } catch (e) {
          if (e && e.name === 'RenderingCancelledException') {
            pageRenders[num] = false;
            return;
          }
          console.warn('Page render error for page', num, e);
          pageRenders[num] = false;
        }
      }

      function updateReadingProgress() {
        var scrollable = container.scrollHeight - container.clientHeight;
        if (scrollable > 0 && readingProgressBar) {
          var pct = Math.min(100, Math.max(0, (container.scrollTop / scrollable) * 100));
          readingProgressBar.style.width = pct.toFixed(1) + '%';
        }
      }

      // --- Intelligent Bi-Directional Scroll & Active Page Tracking ---
      function handleScroll() {
        if (isTeleporting) return;
        var st = container.scrollTop;
        var diff = st - lastScrollTop;

        // Auto-hide toolbar when scrolling down, reveal when scrolling up
        if (diff > 25 && st > 80 && !toolbarHidden) {
          bottomBar.classList.add('bar-hidden');
          toolbarHidden = true;
        } else if (diff < -15 && toolbarHidden) {
          bottomBar.classList.remove('bar-hidden');
          toolbarHidden = false;
        }
        var isScrollingDown = diff >= 0;
        lastScrollTop = Math.max(0, st);

        updateReadingProgress();

        // Calculate active page based on viewport center
        var containerMid = st + (container.clientHeight / 2);
        var activeNum = 1;

        for (var i = 0; i < pageWrappers.length; i++) {
          var el = pageWrappers[i];
          var top = el.offsetTop;
          var bottom = top + el.offsetHeight;
          if (top <= containerMid && bottom >= containerMid) {
            activeNum = i + 1;
            break;
          } else if (top > containerMid) {
            activeNum = Math.max(1, i);
            break;
          }
        }

        if (activeNum !== currentPage) {
          currentPage = activeNum;
          pageNumEl.textContent = currentPage;
        }

        // Bi-directional sequential on-demand rendering based on scroll direction
        queuePageRender(currentPage, true);
        if (isScrollingDown) {
          if (currentPage + 1 <= totalPages) queuePageRender(currentPage + 1, false);
        } else {
          // Scrolling upward: render preceding page on demand
          if (currentPage - 1 >= 1) queuePageRender(currentPage - 1, false);
        }

        // Sliding memory window: aggressively prune canvases farther than 3 pages away on mobile
        pruneFarCanvases(currentPage);
      }

      function pruneFarCanvases(cur) {
        var keepDistance = (window.innerWidth <= 768) ? 6 : 8;
        for (var p in pageRenders) {
          if (!Object.prototype.hasOwnProperty.call(pageRenders, p)) continue;
          var num = parseInt(p, 10);
          if (pageRenders[num] && Math.abs(num - cur) > keepDistance) {
            var wrap = document.getElementById('pageWrap-' + num);
            if (wrap) {
              if (activeRenderTasks[num]) {
                try { activeRenderTasks[num].cancel(); } catch (_) {}
                delete activeRenderTasks[num];
              }
              var c = wrap.querySelector('canvas');
              if (c) {
                c.width = 0;
                c.height = 0;
                c.remove();
              }
              wrap.classList.add('page-placeholder');
              wrap.innerHTML = '<div class="page-skeleton-pulse"></div><span>Page ' + num + '</span>';
              pageRenders[num] = false;
            }
          }
        }
      }

      container.addEventListener('scroll', function () {
        if (!scrollTicking) {
          window.requestAnimationFrame(function () {
            handleScroll();
            scrollTicking = false;
          });
          scrollTicking = true;
        }
      }, { passive: true });

      // Click on Progress Bar seeks directly
      if (readingProgressWrap) {
        readingProgressWrap.addEventListener('click', function (e) {
          var rect = readingProgressWrap.getBoundingClientRect();
          var ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
          var targetScroll = (container.scrollHeight - container.clientHeight) * ratio;
          container.scrollTo({ top: targetScroll, behavior: 'smooth' });
        });
      }

      // Tap / Double-tap handling
      var lastTapTime = 0;
      var lastTapX = 0;
      var lastTapY = 0;
      container.addEventListener('click', function (e) {
        if (e.target.closest('#bottomBar') || e.target.closest('#jumpModal')) return;

        // Reveal toolbar if hidden
        if (toolbarHidden) {
          bottomBar.classList.remove('bar-hidden');
          toolbarHidden = false;
        }

        // Native-like double-tap zoom
        var now = Date.now();
        var distX = Math.abs(e.clientX - lastTapX);
        var distY = Math.abs(e.clientY - lastTapY);
        if (now - lastTapTime < 320 && distX < 40 && distY < 40) {
          e.preventDefault();
          var isDesktop = (container.clientWidth || window.innerWidth) >= 840;
          var baseFit = isDesktop ? getFitHeightScale() : getFitWidthScale();
          if (currentScale < baseFit - 0.03) {
            // Below fit width (e.g. 35% or 50% zoomed out): double-tap restores directly to Fit Width (e.g. 68% on phone)
            applySmoothScale(baseFit, e.clientX, e.clientY, false);
            showToast('Fit (' + Math.round(baseFit * 100) + '%)');
          } else if (currentScale > baseFit + 0.08) {
            // Already zoomed in above fit width: double-tap smoothly zooms back out to Fit Width
            applySmoothScale(baseFit, e.clientX, e.clientY, false);
            showToast('Fit (' + Math.round(baseFit * 100) + '%)');
          } else {
            // At Fit Width: double-tap smoothly zooms in (1.65x) centered directly where user double-tapped!
            var targetZoom = Math.min(baseFit * 1.65, MAX_SCALE);
            applySmoothScale(targetZoom, e.clientX, e.clientY, false);
            showToast('Zoom ' + Math.round(targetZoom * 100) + '%');
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;
        lastTapX = e.clientX;
        lastTapY = e.clientY;
      });

      // Instant teleportation & lazy jump
      function scrollToPage(num, isInstant) {
        if (num < 1 || num > totalPages) return;
        var wrap = document.getElementById('pageWrap-' + num);
        if (!wrap) return;

        var pageDiff = Math.abs(num - currentPage);
        if (pageDiff > 2 || isInstant) {
          isTeleporting = true;
          container.scrollTop = wrap.offsetTop - 8;
          currentPage = num;
          pageNumEl.textContent = num;
          updateReadingProgress();

          // Cancel obsolete renders before jumping
          for (var p in activeRenderTasks) {
            try { activeRenderTasks[p].cancel(); } catch (_) {}
          }
          activeRenderTasks = {};
          renderQueue = [];

          // Render target page immediately with high priority, then adjacent pages sequentially
          queuePageRender(num, true);
          if (num < totalPages) queuePageRender(num + 1, false);
          if (num > 1) queuePageRender(num - 1, false);

          pruneFarCanvases(num);

          setTimeout(function () {
            isTeleporting = false;
          }, 120);
        } else {
          wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentPage = num;
          pageNumEl.textContent = num;
          queuePageRender(num, true);
          if (num + 1 <= totalPages) queuePageRender(num + 1, false);
          if (num - 1 >= 1) queuePageRender(num - 1, false);
        }
      }

      // Mouse Wheel / Trackpad Zoom (Ctrl + Wheel or Meta + Wheel) — zoom ONLY the document without zooming the outer platform
      window.addEventListener('wheel', function (e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          var delta = -e.deltaY;
          var factor;
          if (Math.abs(delta) < 20) {
            // Trackpad fine pinch: continuous exponential zoom
            factor = Math.exp(delta * 0.012);
          } else {
            // Standard stepped mouse wheel notch
            factor = delta > 0 ? 1.14 : 0.88;
          }
          applySmoothScale(currentScale * factor, e.clientX, e.clientY, true);
        }
      }, { passive: false });

      // Touch Pinch Gesture — zoom ONLY the document on mobile/tablets with real-time 60fps tracking
      var initialPinchDist = 0;
      var initialPinchScale = 1.0;
      var pinchFocalX = 0;
      var pinchFocalY = 0;
      var isPinching = false;

      container.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) {
          e.preventDefault(); // Intercept browser-level viewport zoom immediately
          isPinching = true;
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialPinchScale = currentScale;
          pinchFocalX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          pinchFocalY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
      }, { passive: false });

      container.addEventListener('touchmove', function (e) {
        if (e.touches.length === 2 && initialPinchDist > 0) {
          e.preventDefault(); // Trap pinch inside reader, never zoom outer browser
          var curDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          var curFocalX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          var curFocalY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          var scaleRatio = curDist / initialPinchDist;
          applySmoothScale(initialPinchScale * scaleRatio, curFocalX, curFocalY, true);
        }
      }, { passive: false });

      function endPinch() {
        if (isPinching) {
          isPinching = false;
          initialPinchDist = 0;
          container.classList.remove('is-zooming-interactive');
          clearTimeout(renderDebounceTimer);
          renderDebounceTimer = setTimeout(function () {
            reRenderVisiblePages();
          }, 120);
        }
      }

      container.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) endPinch();
      }, { passive: true });
      container.addEventListener('touchcancel', endPinch, { passive: true });

      // Prevent Safari iOS default gesture zooming on the page
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

      // When embedded in parent iframe, coordinate Android system Back gesture to close reader panel safely
      if (window.parent && window.parent !== window) {
        try {
          history.replaceState({ readerInFrame: true, depth: 0 }, '', window.location.href);
          history.pushState({ readerInFrame: true, depth: 1 }, '', window.location.href);
          window.addEventListener('popstate', function () {
            try {
              window.parent.postMessage({ type: 'READER_BACK' }, '*');
            } catch (_) {}
          });
        } catch (_) {}
      }

      // Toolbar Controls
      document.getElementById('prevBtn').addEventListener('click', function () { scrollToPage(currentPage - 1); });
      document.getElementById('nextBtn').addEventListener('click', function () { scrollToPage(currentPage + 1); });
      document.getElementById('zoomInBtn').addEventListener('click', function () {
        applySmoothScale(currentScale * 1.2, null, null, false);
        showToast('Zoom: ' + Math.round(currentScale * 100) + '%');
      });
      document.getElementById('zoomOutBtn').addEventListener('click', function () {
        applySmoothScale(currentScale * 0.833, null, null, false);
        showToast('Zoom: ' + Math.round(currentScale * 100) + '%');
      });
      if (zoomPresetBtn) {
        zoomPresetBtn.addEventListener('click', toggleFitZoom);
      }

      // Quick Jump & Visual Scrubber Dialog
      pageJumpBtn.addEventListener('click', function () {
        jumpPageInput.value = currentPage;
        jumpPageInput.max = totalPages;
        jumpScrubber.max = totalPages;
        jumpScrubber.value = currentPage;
        document.getElementById('jumpCurBadge').textContent = currentPage;
        document.getElementById('jumpMaxBadge').textContent = totalPages;
        document.getElementById('jumpTotalText').textContent = '/ ' + totalPages;
        jumpModal.classList.add('active');
        setTimeout(function () { jumpPageInput.focus(); jumpPageInput.select(); }, 50);
      });

      jumpScrubber.addEventListener('input', function () {
        jumpPageInput.value = jumpScrubber.value;
        document.getElementById('jumpCurBadge').textContent = jumpScrubber.value;
      });

      jumpPageInput.addEventListener('input', function () {
        var v = parseInt(jumpPageInput.value, 10);
        if (!isNaN(v) && v >= 1 && v <= totalPages) {
          jumpScrubber.value = v;
          document.getElementById('jumpCurBadge').textContent = v;
        }
      });

      document.querySelectorAll('.jump-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          var target = chip.dataset.target;
          var pageVal = 1;
          if (target === 'first') pageVal = 1;
          else if (target === 'last') pageVal = totalPages;
          else if (target === '25') pageVal = Math.max(1, Math.round(totalPages * 0.25));
          else if (target === '50') pageVal = Math.max(1, Math.round(totalPages * 0.50));
          else if (target === '75') pageVal = Math.max(1, Math.round(totalPages * 0.75));

          jumpPageInput.value = pageVal;
          jumpScrubber.value = pageVal;
          document.getElementById('jumpCurBadge').textContent = pageVal;
        });
      });

      jumpCancelBtn.addEventListener('click', function () {
        jumpModal.classList.remove('active');
      });

      jumpModal.addEventListener('click', function (e) {
        if (e.target === jumpModal) jumpModal.classList.remove('active');
      });

      function submitJump() {
        var val = parseInt(jumpPageInput.value, 10);
        if (!isNaN(val) && val >= 1 && val <= totalPages) {
          jumpModal.classList.remove('active');
          scrollToPage(val, true); // Instant jump!
        }
      }
      jumpGoBtn.addEventListener('click', submitJump);
      jumpPageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitJump();
        else if (e.key === 'Escape') jumpModal.classList.remove('active');
      });

      document.getElementById('retryBtn').addEventListener('click', loadDocument);

      // --- Document Issue Report & Mismatch Warning System ---
      window.SGOU_REPORT_FORM = window.SGOU_REPORT_FORM || {
        supportPhone: '919544572262',
        formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSc_DEMO_FORM_ID_REPLACE_ME/formResponse',
        entries: {
          course: 'entry.1000001',
          category: 'entry.1000004',
          notes: 'entry.1000005',
          url: 'entry.1000006'
        }
      };
      var reportModal = document.getElementById('reportModal');
      var reportBtn = document.getElementById('reportBtn');
      var readerMismatchReportBtn = document.getElementById('readerMismatchReportBtn');
      var readerMismatchDismissBtn = document.getElementById('readerMismatchDismissBtn');
      var reportCloseBtn = document.getElementById('readerReportCloseBtn');
      var courseCode = params.get('code') || '';
      var isOverrideParam = params.get('override') === '1' || params.get('mismatch') === '1';

      function checkAndDisplayMismatch() {
        var banner = document.getElementById('readerMismatchBanner');
        if (!banner) return;
        if (isOverrideParam) {
          banner.style.display = 'block';
        }
        var sources = ['./data/pyq_overrides.json', '/data/pyq_overrides.json', '/pyq_overrides.json'];
        function tryLoad(idx) {
          if (idx >= sources.length) return;
          fetch(sources[idx])
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data) return tryLoad(idx + 1);
              var matched = null;
              for (var key in data) {
                if (rawFile.includes(encodeURIComponent(key)) || rawFile.includes(key) || (courseCode && key.includes(courseCode))) {
                  matched = data[key];
                  break;
                }
              }
              if (matched || isOverrideParam) {
                banner.style.display = 'block';
                if (matched) {
                  var b = document.getElementById('readerMismatchBadge');
                  var d = document.getElementById('readerMismatchDesc');
                  if (b && matched.badge) b.textContent = matched.badge + ':';
                  if (d && matched.reason) d.textContent = matched.reason;
                }
              }
            })
            .catch(function () { tryLoad(idx + 1); });
        }
        tryLoad(0);
      }

      function isGFormConfigured() {
        var cfg = window.SGOU_REPORT_FORM;
        if (!cfg || !cfg.formUrl) return false;
        var url = String(cfg.formUrl).trim();
        if (!url.startsWith('https://docs.google.com/forms/')) return false;
        if (/DEMO|REPLACE_ME|SAMPLE|TEST_FORM/i.test(url)) return false;
        return true;
      }

      function syncReaderReportModalMode() {
        var isGForm = isGFormConfigured();
        var submitBtn = document.getElementById('readerReportSubmit');
        var waToolBtn = document.getElementById('readerReportWhatsApp');

        if (!isGForm) {
          if (submitBtn) {
            submitBtn.classList.add('whatsapp-primary');
            submitBtn.setAttribute('data-channel', 'whatsapp');
            submitBtn.title = 'Send report directly on WhatsApp';
            submitBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.031 2C6.496 2 2 6.494 2 12.029c0 1.93.548 3.738 1.498 5.275L2 22l4.832-1.454A9.974 9.974 0 0 0 12.031 22C17.566 22 22 17.506 22 12.029 22 6.494 17.566 2 12.031 2zm5.727 14.168c-.24.673-1.393 1.288-1.928 1.343-.49.05-1.127.08-3.32-.828-2.618-1.082-4.294-3.757-4.425-3.931-.13-.174-1.054-1.402-1.054-2.674 0-1.272.668-1.897.906-2.155.239-.258.522-.323.696-.323.174 0 .348.002.5.01.163.008.382-.062.597.455.228.549.773 1.884.84 2.022.066.138.11.3.022.474-.088.174-.131.283-.262.434-.13.151-.274.337-.392.454-.13.13-.265.272-.114.531.151.26 1.058 1.737 2.272 2.818 1.562 1.39 2.878 1.82 3.287 2.022.409.202.648.169.887-.109.239-.278 1.026-1.196 1.301-1.606.275-.41.55-.342.923-.203.373.138 2.36 1.112 2.765 1.314.405.202.675.303.774.474.098.172.098.998-.142 1.671z"/></svg><span id="readerReportSubmitBtnText">Report on WhatsApp</span>';
          }
          if (waToolBtn) waToolBtn.style.display = 'none';
        } else {
          if (submitBtn) {
            submitBtn.classList.remove('whatsapp-primary');
            submitBtn.setAttribute('data-channel', 'form');
            submitBtn.title = 'Submit report';
            submitBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg><span id="readerReportSubmitBtnText">Submit</span>';
          }
          if (waToolBtn) waToolBtn.style.display = 'inline-flex';
        }
      }

      function openReaderReport() {
        if (!reportModal) return;
        var t = document.getElementById('readerReportDocTitle');
        var m = document.getElementById('readerReportDocMeta');
        if (t) t.textContent = docName + (courseCode ? ' (' + courseCode + ')' : '');
        if (m) m.textContent = 'SGOU Academic Paper \u2022 Page ' + currentPage + ' of ' + (totalPages || 1);
        var note = document.getElementById('readerReportNote');
        var selectEl = document.getElementById('readerReportReasonSelect');
        if (note) note.value = '';
        if (selectEl) selectEl.selectedIndex = 0;

        syncReaderReportModalMode();
        reportModal.classList.add('active');
        setTimeout(function () {
          if (selectEl) selectEl.focus();
        }, 60);
      }

      function closeReaderReport() {
        if (reportModal) reportModal.classList.remove('active');
        var submitBtn = document.getElementById('readerReportSubmit');
        if (submitBtn) {
          submitBtn.classList.remove('submitting', 'success');
          submitBtn.disabled = false;
        }
      }

      function submitReaderReport(channel) {
        if (!channel || channel === 'auto') {
          var btn = document.getElementById('readerReportSubmit');
          channel = (btn && btn.getAttribute('data-channel')) || (isGFormConfigured() ? 'form' : 'whatsapp');
        }

        if (channel === 'form' && !isGFormConfigured()) {
          return submitReaderReport('whatsapp');
        }

        var note = (document.getElementById('readerReportNote')?.value || '').trim();
        var selectEl = document.getElementById('readerReportReasonSelect');
        var reasonVal = selectEl ? selectEl.value : 'mismatch';
        var reasonMap = {
          mismatch: 'Wrong Document / Syllabus Mismatch',
          corrupted: 'Blank or Corrupt PDF',
          metadata: 'Incorrect Date or Subject Code',
          other: 'Other Issue'
        };
        var reasonText = reasonMap[reasonVal] || 'Other Issue';
        var docTitle = (docName ? docName + (courseCode ? ' (' + courseCode + ')' : '') : (courseCode || 'Course Material'));
        var docUrl = rawFile || window.location.href;

        if (channel === 'form') {
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            showToast('Network offline. Switching to WhatsApp...');
            return submitReaderReport('whatsapp');
          }

          var submitBtn = document.getElementById('readerReportSubmit');
          var submitText = document.getElementById('readerReportSubmitBtnText');
          var origText = submitText ? submitText.textContent : 'Submit';

          if (submitBtn) {
            submitBtn.classList.add('submitting');
            submitBtn.disabled = true;
          }
          if (submitText) submitText.textContent = 'Submitting...';

          var doFinish = function () {
            if (submitBtn) {
              submitBtn.classList.remove('submitting');
              submitBtn.classList.add('success');
            }
            if (submitText) submitText.textContent = 'Report Submitted';
            showToast('Thank you! Document issue reported for inspection.');

            setTimeout(function () {
              closeReaderReport();
              if (submitBtn) {
                submitBtn.classList.remove('success');
                submitBtn.disabled = false;
              }
              if (submitText) submitText.textContent = origText;
            }, 1000);
          };

          var doFallback = function () {
            if (submitBtn) {
              submitBtn.classList.remove('submitting');
              submitBtn.disabled = false;
            }
            if (submitText) submitText.textContent = origText;
            showToast('Form unreachable. Switching to WhatsApp...');
            submitReaderReport('whatsapp');
          };

          try {
            var cfg = window.SGOU_REPORT_FORM;
            var formData = new FormData();
            if (cfg.entries && cfg.entries.course) formData.append(cfg.entries.course, docTitle);
            if (cfg.entries && cfg.entries.category) formData.append(cfg.entries.category, reasonText);
            if (cfg.entries && cfg.entries.notes) formData.append(cfg.entries.notes, (note ? note + ' [Page ' + currentPage + ']' : '[Page ' + currentPage + ']'));
            if (cfg.entries && cfg.entries.url) formData.append(cfg.entries.url, docUrl);

            var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
            var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 4500) : null;

            fetch(cfg.formUrl, { method: 'POST', mode: 'no-cors', body: formData, signal: ctrl ? ctrl.signal : undefined })
              .then(function () {
                if (timer) clearTimeout(timer);
                doFinish();
              })
              .catch(function () {
                if (timer) clearTimeout(timer);
                doFallback();
              });
          } catch (_) {
            doFallback();
          }
          return;
        }

        if (channel === 'whatsapp') {
          var rawPhone = (window.SGOU_REPORT_FORM && window.SGOU_REPORT_FORM.supportPhone) || '919544572262';
          var phone = String(rawPhone).replace(/[^0-9]/g, '');
          var waMessage = [
            '*SGOU Document Issue Report*',
            '----------------------------------------',
            '*Document:* ' + docTitle,
            '*Course Code:* ' + (courseCode || 'N/A'),
            '*Page Viewed:* Page ' + currentPage + ' of ' + totalPages,
            '*Issue Type:* ' + reasonText,
            note ? '*Note:* ' + note : null,
            '*URL:* ' + docUrl,
            '----------------------------------------',
            '_Reported via SGOU Academic Reader v3.0.0_'
          ].filter(Boolean).join('\n');

          var waUrl = phone
            ? ('https://wa.me/' + phone + '?text=' + encodeURIComponent(waMessage))
            : ('https://api.whatsapp.com/send?text=' + encodeURIComponent(waMessage));

          window.open(waUrl, '_blank', 'noopener,noreferrer');
          showToast('Opening WhatsApp to send report...');
          closeReaderReport();
          return;
        }

        if (channel === 'copy') {
          var copyText = [
            '[SGOU Document Issue Report]',
            '----------------------------------------',
            'Document:    ' + docTitle,
            'Course Code: ' + (courseCode || 'N/A'),
            'Page Viewed: Page ' + currentPage + ' of ' + totalPages,
            'Issue Type:  ' + reasonText,
            note ? 'Note:        ' + note : null,
            'URL:         ' + docUrl,
            'Timestamp:   ' + new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC',
            '----------------------------------------'
          ].filter(Boolean).join('\n');

          navigator.clipboard.writeText(copyText).then(function () {
            showToast('Report details copied to clipboard');
          }).catch(function () {
            showToast('Please copy report manually');
          });
          closeReaderReport();
          return;
        }
      }

      if (reportBtn) reportBtn.addEventListener('click', openReaderReport);
      if (readerMismatchReportBtn) readerMismatchReportBtn.addEventListener('click', openReaderReport);
      if (readerMismatchDismissBtn) {
        readerMismatchDismissBtn.addEventListener('click', function () {
          var b = document.getElementById('readerMismatchBanner');
          if (b) b.style.display = 'none';
        });
      }
      if (reportCloseBtn) reportCloseBtn.addEventListener('click', closeReaderReport);
      var reportCancelBtn = document.getElementById('readerReportCancelBtn');
      if (reportCancelBtn) reportCancelBtn.addEventListener('click', closeReaderReport);
      if (reportModal) {
        reportModal.addEventListener('click', function (e) {
          if (e.target === reportModal) closeReaderReport();
        });
      }
      document.getElementById('readerReportSubmit')?.addEventListener('click', function () { submitReaderReport('auto'); });
      document.getElementById('readerReportWhatsApp')?.addEventListener('click', function () { submitReaderReport('whatsapp'); });
      document.getElementById('readerReportCopy')?.addEventListener('click', function () { submitReaderReport('copy'); });

      // Keyboard navigation
      window.addEventListener('keydown', function (e) {
        if (reportModal && reportModal.classList.contains('active')) {
          if (e.key === 'Escape') {
            e.preventDefault();
            closeReaderReport();
            return;
          }
          return;
        }
        if (jumpModal.classList.contains('active')) return;

        if (e.key === 'Escape' || e.key === 'Backspace') {
          e.preventDefault();
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'READER_BACK' }, '*');
          }
          return;
        }

        var key = e.key.toLowerCase();

        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          scrollToPage(currentPage - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault();
          scrollToPage(currentPage + 1);
        } else if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          applySmoothScale(currentScale * 1.2, null, null, false);
          showToast('Zoom: ' + Math.round(currentScale * 100) + '%');
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          applySmoothScale(currentScale * 0.833, null, null, false);
          showToast('Zoom: ' + Math.round(currentScale * 100) + '%');
        } else if (e.key === '0') {
          e.preventDefault();
          toggleFitZoom();
        } else if (key === 'f') {
          e.preventDefault();
          toggleFullscreen();
        } else if (key === 'r') {
          e.preventDefault();
          openReaderReport();
        } else if (key === 't' || key === 'e') {
          e.preventDefault();
          cycleFilterMode();
        } else if (e.key === 'Home') {
          e.preventDefault();
          scrollToPage(1, true);
        } else if (e.key === 'End') {
          e.preventDefault();
          scrollToPage(totalPages, true);
        }
      });

      // Window resize adaptation
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          var isDesktop = (container.clientWidth || window.innerWidth) >= 840;
          var defScale = isDesktop ? getFitHeightScale() : getFitWidthScale();
          if (Math.abs(currentScale - defScale) < 0.15) {
            applySmoothScale(defScale);
          }
        }, 200);
      });

      loadDocument();
      checkAndDisplayMismatch();
    })();
  </script>
</body>
</html>
