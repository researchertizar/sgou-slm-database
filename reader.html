<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://d198y4z1gpgoxg.cloudfront.net;">
  <title>Academic Reader — SGOU</title>
  <style>
    /* ============================================================
       THEME SYSTEM — Synchronized with SGOU Academic Design Tokens
       ============================================================ */
    :root, html[data-theme="light"] {
      color-scheme: light;
      --bg: #ebe4d6;
      --surface: #ffffff;
      --surface-subtle: #f5f0e8;
      --surface-border: #d4cdc0;
      --text: #181512;
      --text-muted: #6b6357;
      --accent: #b43d28;
      --accent-hover: #96311e;
      --toolbar-bg: rgba(245, 240, 232, 0.94);
      --toolbar-border: rgba(212, 205, 192, 0.9);
      --toolbar-text: #181512;
      --toolbar-btn-hover: rgba(180, 61, 40, 0.1);
      --canvas-shadow: 0 4px 20px rgba(26, 23, 20, 0.12);
      --placeholder-bg: #e2dbce;
      --placeholder-text: #82796e;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141210;
      --surface: #1e1b18;
      --surface-subtle: #24221f;
      --surface-border: #38322c;
      --text: #f0ede8;
      --text-muted: #a39e95;
      --accent: #e5725a;
      --accent-hover: #f28b75;
      --toolbar-bg: rgba(30, 27, 24, 0.94);
      --toolbar-border: rgba(56, 50, 44, 0.9);
      --toolbar-text: #f0ede8;
      --toolbar-btn-hover: rgba(255, 255, 255, 0.12);
      --canvas-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
      --placeholder-bg: #24201c;
      --placeholder-text: #787168;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    #readerWrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Top Reading Progress Bar */
    #readingProgressWrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.08);
      z-index: 120;
      cursor: pointer;
    }
    #readingProgressBar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.08s ease;
      box-shadow: 0 0 6px var(--accent);
    }

    /* Scrollable Container with generous bottom clearance */
    #viewerContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      display: flex;
      flex-direction: column;
      align-items: center;
      align-items: safe center;
      padding: 16px 10px calc(80px + env(safe-area-inset-bottom, 0px)) 10px;
      gap: 16px;
      scroll-behavior: auto;
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* Page Canvas Wrappers */
    .pdf-page-wrap {
      position: relative;
      background: #ffffff;
      box-shadow: var(--canvas-shadow);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
      flex-shrink: 0;
      transition: box-shadow 0.2s ease, width 0.15s cubic-bezier(0.16, 1, 0.3, 1), height 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center top;
      will-change: width, height;
    }

    /* Instant 60fps tracking during live touch pinch or wheel zoom gestures (no transition lag) */
    #viewerContainer.is-zooming-interactive .pdf-page-wrap {
      transition: none !important;
    }

    .pdf-page-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .page-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--placeholder-bg);
      color: var(--placeholder-text);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .page-skeleton-pulse {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--placeholder-text);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      opacity: 0.7;
    }

    /* Floating Toolbar */
    #bottomBar {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--toolbar-border);
      padding: 5px 9px;
      border-radius: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.22);
      z-index: 100;
      max-width: 96vw;
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.26s ease;
    }

    #bottomBar.bar-hidden {
      transform: translate(-50%, calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }

    .bar-btn {
      background: transparent;
      border: none;
      color: var(--toolbar-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }
    .bar-btn:hover {
      background: var(--toolbar-btn-hover);
      color: var(--accent);
    }
    .bar-btn:active {
      transform: scale(0.92);
    }
    .bar-btn:disabled, .bar-btn[aria-disabled="true"] {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .page-info-btn {
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--toolbar-text);
      padding: 4px 8px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .page-info-btn:hover {
      background: var(--toolbar-btn-hover);
    }
    #zoomPresetBtn {
      min-width: 44px;
      justify-content: center;
      font-size: 12px;
    }

    .bar-divider {
      width: 1px;
      height: 18px;
      background: var(--toolbar-border);
      margin: 0 2px;
    }

    /* Jump to Page Modal Dialog */
    #jumpModal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 16px;
    }
    #jumpModal.active {
      display: flex;
    }
    .jump-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      max-width: 320px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      animation: jumpPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes jumpPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .jump-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .jump-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .jump-current-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
    }
    .jump-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .jump-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      background: var(--surface-subtle);
      color: var(--text);
      outline: none;
      text-align: center;
    }
    .jump-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(180, 61, 40, 0.2);
    }
    .jump-total-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .jump-scrubber-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .jump-scrubber {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
    }
    .jump-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .jump-chip {
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .jump-chip:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .jump-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }
    .jump-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }
    .jump-btn-cancel {
      background: transparent;
      color: var(--text-muted);
    }
    .jump-btn-go {
      background: var(--accent);
      color: #ffffff;
    }

    /* Minimal Toast Notifications */
    #readerToast {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--toolbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--toolbar-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      z-index: 180;
      white-space: nowrap;
    }
    #readerToast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Loading Overlay */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      z-index: 200;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(180, 61, 40, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      max-width: 280px;
    }

    #errorBox {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
    }
    .error-title {
      font-size: 15px;
      font-weight: 600;
      color: #dc2626;
    }
    .retry-btn {
      padding: 8px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Eye-Comfort Filter Classes */
    #viewerContainer.filter-sepia canvas {
      filter: sepia(0.38) contrast(0.96) brightness(0.96);
    }
    #viewerContainer.filter-dark canvas {
      filter: invert(0.88) hue-rotate(180deg) brightness(0.95) contrast(1.05);
    }
  </style>
</head>
<body>
  <div id="readerWrap">
    <!-- Top Reading Progress Indicator -->
    <div id="readingProgressWrap" title="Reading progress — click anywhere to seek">
      <div id="readingProgressBar"></div>
    </div>

    <!-- Toast Notification -->
    <div id="readerToast"></div>

    <!-- Initial Loader -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingMsg">Preparing document preview&hellip;</div>
      <div id="errorBox">
        <div class="error-title" id="errorMsg">Could not load document</div>
        <button type="button" class="retry-btn" id="retryBtn">Retry</button>
      </div>
    </div>

    <!-- Scrollable Pages Viewport -->
    <div id="viewerContainer"></div>

    <!-- Floating Navigation Bar -->
    <div id="bottomBar">
      <button type="button" class="bar-btn" id="prevBtn" title="Previous page (Left Arrow)" aria-label="Previous page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <button type="button" class="page-info-btn" id="pageJumpBtn" title="Click to jump or scrub through pages" aria-label="Jump to page">
        <span id="pageNum">1</span> / <span id="pageCount">&ndash;</span>
      </button>

      <button type="button" class="bar-btn" id="nextBtn" title="Next page (Right Arrow)" aria-label="Next page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="bar-divider"></div>

      <button type="button" class="bar-btn" id="zoomOutBtn" title="Zoom Out (-)" aria-label="Zoom out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <button type="button" class="page-info-btn" id="zoomPresetBtn" title="Zoom Level (Click to toggle Fit Page / Fit Width)" aria-label="Zoom level">
        <span id="zoomPresetText">100%</span>
      </button>

      <button type="button" class="bar-btn" id="zoomInBtn" title="Zoom In (+)" aria-label="Zoom in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <div class="bar-divider"></div>

      <!-- Eye-Comfort Reading Mode Toggle (Normal -> Sepia -> Dark) -->
      <button type="button" class="bar-btn" id="filterBtn" title="Eye-Comfort Reading Mode (T)" aria-label="Eye-comfort mode">
        <svg id="filterIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <!-- Dynamic Fullscreen Button (Toggles between Enter and Exit based on event) -->
      <button type="button" class="bar-btn" id="fullscreenBtn" title="Enter fullscreen (F)" aria-label="Enter fullscreen">
        <svg id="fullscreenIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>

    <!-- Quick Jump & Visual Scrubber Modal Dialog -->
    <div id="jumpModal">
      <div class="jump-card">
        <div class="jump-header">
          <div class="jump-title">Jump to Page</div>
          <span class="jump-current-badge">Page <span id="jumpCurBadge">1</span> of <span id="jumpMaxBadge">&ndash;</span></span>
        </div>

        <div class="jump-input-row">
          <input type="number" id="jumpPageInput" class="jump-input" min="1" step="1" placeholder="Page #">
          <span class="jump-total-text" id="jumpTotalText">/ &ndash;</span>
        </div>

        <div class="jump-scrubber-wrap">
          <input type="range" id="jumpScrubber" class="jump-scrubber" min="1" max="1" value="1">
        </div>

        <div class="jump-chips">
          <button type="button" class="jump-chip" data-target="first">Cover (1)</button>
          <button type="button" class="jump-chip" data-target="25">25%</button>
          <button type="button" class="jump-chip" data-target="50">50%</button>
          <button type="button" class="jump-chip" data-target="75">75%</button>
          <button type="button" class="jump-chip" data-target="last">End</button>
        </div>

        <div class="jump-actions">
          <button type="button" class="jump-btn jump-btn-cancel" id="jumpCancelBtn">Cancel</button>
          <button type="button" class="jump-btn jump-btn-go" id="jumpGoBtn">Jump Now</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./pdfjs/pdf.min.js"></script>
  <script>
    (function () {
      'use strict';

      // --- Theme Synchronization ---
      function applyTheme() {
        var params = new URLSearchParams(window.location.search);
        var requestedTheme = params.get('theme');
        var theme = 'light';

        if (requestedTheme === 'dark' || requestedTheme === 'light') {
          theme = requestedTheme;
        } else {
          try {
            theme = localStorage.getItem('sgou-theme-v2') || 'light';
          } catch (_) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      }
      applyTheme();
      window.addEventListener('storage', applyTheme);
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'sgou-theme-change') {
          document.documentElement.setAttribute('data-theme', e.data.theme);
        }
      });

      // --- Eye-Comfort Filter Synchronization & Cycling ---
      var container = document.getElementById('viewerContainer');
      var filterBtn = document.getElementById('filterBtn');
      var filterIcon = document.getElementById('filterIcon');
      var toastEl = document.getElementById('readerToast');
      var toastTimer = null;

      var FILTER_MODES = ['normal', 'sepia', 'dark'];
      var FILTER_LABELS = {
        normal: 'Natural Document',
        sepia: 'Warm Sepia (Eye Comfort)',
        dark: 'Night Invert (Dark Mode)'
      };

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 1800);
      }

      function updateFilterUI(mode) {
        container.classList.remove('filter-sepia', 'filter-dark');
        if (mode === 'sepia') {
          container.classList.add('filter-sepia');
          filterIcon.innerHTML = '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10M6 14h6"/>';
          filterBtn.title = 'Warm Sepia Mode (T)';
        } else if (mode === 'dark') {
          container.classList.add('filter-dark');
          filterIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
          filterBtn.title = 'Night Invert Mode (T)';
        } else {
          filterIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
          filterBtn.title = 'Natural Document Mode (T)';
        }
      }

      function applySavedFilter() {
        var mode = 'normal';
        try { mode = localStorage.getItem('sgou-pdf-filter') || 'normal'; } catch (_) {}
        updateFilterUI(mode);
      }
      applySavedFilter();
      window.addEventListener('storage', applySavedFilter);

      function cycleFilterMode() {
        var cur = 'normal';
        try { cur = localStorage.getItem('sgou-pdf-filter') || 'normal'; } catch (_) {}
        var nextIdx = (FILTER_MODES.indexOf(cur) + 1) % FILTER_MODES.length;
        var next = FILTER_MODES[nextIdx];
        try { localStorage.setItem('sgou-pdf-filter', next); } catch (_) {}
        updateFilterUI(next);
        showToast(FILTER_LABELS[next]);
      }
      filterBtn.addEventListener('click', cycleFilterMode);

      // --- Fullscreen Dynamic Management ---
      var fullscreenBtn = document.getElementById('fullscreenBtn');
      var fullscreenIcon = document.getElementById('fullscreenIcon');

      function isFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
      }

      function updateFullscreenUI() {
        var full = isFullscreen();
        if (full) {
          // Collapse / Exit fullscreen icon
          fullscreenIcon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
          fullscreenBtn.title = 'Exit fullscreen (F / Esc)';
          fullscreenBtn.setAttribute('aria-label', 'Exit fullscreen');
        } else {
          // Expand / Enter fullscreen icon
          fullscreenIcon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
          fullscreenBtn.title = 'Enter fullscreen (F)';
          fullscreenBtn.setAttribute('aria-label', 'Enter fullscreen');
        }
      }

      function toggleFullscreen() {
        if (!isFullscreen()) {

      var loadingMsg = document.getElementById('loadingMsg');
      var errorBox = document.getElementById('errorBox');
      var errorMsg = document.getElementById('errorMsg');
      var bottomBar = document.getElementById('bottomBar');
      var pageNumEl = document.getElementById('pageNum');
      var pageCountEl = document.getElementById('pageCount');
      var pageJumpBtn = document.getElementById('pageJumpBtn');
      var readingProgressBar = document.getElementById('readingProgressBar');
      var readingProgressWrap = document.getElementById('readingProgressWrap');

      var jumpModal = document.getElementById('jumpModal');
      var jumpPageInput = document.getElementById('jumpPageInput');
      var jumpScrubber = document.getElementById('jumpScrubber');
      var jumpCancelBtn = document.getElementById('jumpCancelBtn');
      var jumpGoBtn = document.getElementById('jumpGoBtn');

      var pdfDoc = null;
      var totalPages = 0;
      var currentPage = 1;
      var currentScale = 1.0;

      var unscaledPageHeight = 841.89;

      var toolbarHidden = false;

      function showError(msg) {

      function resolveFileUrl(url) {
        if (!url) return '';
        if (url.startsWith('blob:') || url.startsWith('data:') || url.startsWith('/') || url.startsWith('./')) {

        try {
          if (window.location.origin && url.startsWith(window.location.origin)) {

          }

      }

      async function loadDocument() {
        if (!rawFile) {

        }

        var spinner = document.querySelector('.spinner');
        if (spinner) spinner.style.display = 'block';
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = 'Loading ' + docName + '\u2026';
        errorBox.style.display = 'none';

        var targetUrl = resolveFileUrl(rawFile);

        // Check device CacheStorage for instant offline retrieval
        if (!rawFile.startsWith('blob:') && 'caches' in window) {

            var cache = await caches.open('sgou-offline-docs');
            var match = await cache.match(rawFile);
            if (match) {

            url: targetUrl,
            rangeChunkSize: 65536,
            disableAutoFetch: false,
            disableStream: false

          totalPages = pdfDoc.numPages;
          pageCountEl.textContent = totalPages;

          // Compute initial scale to fit container width cleanly
          var firstPage = await pdfDoc.getPage(1);
          var unscaledViewport = firstPage.getViewport({ scale: 1 });
          unscaledPageWidth = unscaledViewport.width;
          unscaledPageHeight = unscaledViewport.height;

      var zoomPresetBtn = document.getElementById('zoomPresetBtn');
      var zoomPresetText = document.getElementById('zoomPresetText');
      var zoomInBtn = document.getElementById('zoomInBtn');
      var zoomOutBtn = document.getElementById('zoomOutBtn');
      var activeRenderTasks = {};
      var renderDebounceTimer = null;
      var isTeleporting = false;
      var MIN_SCALE = 0.35;
      var MAX_SCALE = 3.5;

      function getFitHeightScale() {
        var cHeight = container.clientHeight || window.innerHeight;
        var availHeight = Math.max(cHeight - 48, 380);
        return Math.min(Math.max(availHeight / unscaledPageHeight, MIN_SCALE), 2.2);

      function getFitWidthScale() {

      function calculateInitialScale() {

          currentScale = getFitWidthScale();

      function updateZoomUI() {
        if (zoomPresetText) {
          zoomPresetText.textContent = Math.round(currentScale * 100) + '%';

        if (zoomPresetBtn) {
          var fitH = getFitHeightScale();
          var isFitH = Math.abs(currentScale - fitH) < 0.08;
          zoomPresetBtn.title = isFitH ? 'Zoom: ' + Math.round(currentScale * 100) + '% (Click for Fit Width)' : 'Zoom: ' + Math.round(currentScale * 100) + '% (Click for Fit Page)';

      function toggleFitZoom() {

          showToast('Fit to Width (' + Math.round(fitW * 100) + '%)');
        } else {
          applySmoothScale(fitH, null, null, false);
          showToast('Fit to Page (' + Math.round(fitH * 100) + '%)');
        }

      function applySmoothScale(newScale, focalX, focalY, isInteractive) {

        if (Math.abs(newScale - oldScale) < 0.002) return;

        if (isInteractive) {

        } else {

        // Focal point in container viewport coordinates
        var cRect = container.getBoundingClientRect();
        var fx = (typeof focalX === 'number') ? (focalX - cRect.left) : (container.clientWidth / 2);
        var fy = (typeof focalY === 'number') ? (focalY - cRect.top) : (container.clientHeight / 2);

        // Content point under focal center before scaling
        var contentX = container.scrollLeft + fx;
        var contentY = container.scrollTop + fy;

        currentScale = newScale;
        updateZoomUI();

        var scaledWidth = Math.floor(unscaledPageWidth * currentScale);
        var scaledHeight = Math.floor(unscaledPageHeight * currentScale);

        // Resize all page wrappers (existing canvases scale smoothly in GPU memory without white flash)
        for (var i = 0; i < pageWrappers.length; i++) {
          var wrap = pageWrappers[i];
          wrap.style.width = scaledWidth + 'px';
          wrap.style.height = scaledHeight + 'px';
        }

        // Keep focal point stationary under cursor or fingers
        var scaleRatio = newScale / oldScale;
        var targetScrollLeft = (contentX * scaleRatio) - fx;
        var targetScrollTop = (contentY * scaleRatio) - fy;

        container.scrollLeft = Math.max(0, targetScrollLeft);
        container.scrollTop = Math.max(0, targetScrollTop);

      function reRenderVisiblePages() {

        var cBottom = cTop + container.clientHeight;

          var wBottom = wTop + wrap.offsetHeight;

        }

      function createPagePlaceholders() {

        pageWrappers = [];
        pageRenders = {};

        var scaledHeight = Math.floor(unscaledPageHeight * currentScale);

          wrap.id = 'pageWrap-' + i;
          wrap.dataset.page = i;
          wrap.style.width = scaledWidth + 'px';
          wrap.style.height = scaledHeight + 'px';
          wrap.innerHTML = '<div class="page-skeleton-pulse"></div><span>Page ' + i + '</span>';

          container.appendChild(wrap);
          pageWrappers.push(wrap);
        }
      }

      function initIntersectionObserver() {

          rootMargin: '380px 0px 380px 0px',

            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            wrap.innerHTML = '';
            wrap.appendChild(canvas);
            wrap.classList.remove('page-placeholder');

            var renderTask = page.render({
              canvasContext: canvas.getContext('2d'),

            newCanvas.width = Math.floor(viewport.width);
            newCanvas.height = Math.floor(viewport.height);
            newCanvas.style.width = '100%';
            newCanvas.style.height = '100%';

            if (activeRenderTasks[num]) {
              try { activeRenderTasks[num].cancel(); } catch (_) {}
            }

            var renderTask = page.render({
              canvasContext: newCanvas.getContext('2d'),
              viewport: viewport
            });
            activeRenderTasks[num] = renderTask;
            await renderTask.promise;
            delete activeRenderTasks[num];

            // Atomic swap: replace old canvas with the freshly rendered high-DPI canvas
            if (existingCanvas.parentNode === wrap) {

      function updateReadingProgress() {

      // --- Intelligent Bi-Directional Scroll & Active Page Tracking ---
      function handleScroll() {

        // Auto-hide toolbar when scrolling down, reveal when scrolling up
        if (diff > 25 && st > 80 && !toolbarHidden) {

        for (var i = 0; i < pageWrappers.length; i++) {

      function pruneFarCanvases(cur) {

                c.height = 0;

      // Instant teleportation & lazy jump

          pageNumEl.textContent = num;

          pinchFocalX = (e.touches[0].clientX + e.touches[1].clientX) / 2;

      function endPinch() {

          initialPinchDist = 0;

      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });

      // Toolbar Controls
      document.getElementById('prevBtn').addEventListener('click', function () { scrollToPage(currentPage - 1); });
      document.getElementById('nextBtn').addEventListener('click', function () { scrollToPage(currentPage + 1); });
      document.getElementById('zoomInBtn').addEventListener('click', function () {

        showToast('Zoom: ' + Math.round(currentScale * 100) + '%');

      document.getElementById('zoomOutBtn').addEventListener('click', function () {
        applySmoothScale(currentScale * 0.833, null, null, false);

      });
      if (zoomPresetBtn) {

      }

      // Quick Jump & Visual Scrubber Dialog
      pageJumpBtn.addEventListener('click', function () {

        jumpPageInput.max = totalPages;
        jumpScrubber.max = totalPages;
        jumpScrubber.value = currentPage;

        document.getElementById('jumpMaxBadge').textContent = totalPages;
        document.getElementById('jumpTotalText').textContent = '/ ' + totalPages;

        setTimeout(function () { jumpPageInput.focus(); jumpPageInput.select(); }, 50);

      jumpScrubber.addEventListener('input', function () {
        jumpPageInput.value = jumpScrubber.value;
        document.getElementById('jumpCurBadge').textContent = jumpScrubber.value;
      });

      jumpPageInput.addEventListener('input', function () {
        var v = parseInt(jumpPageInput.value, 10);
        if (!isNaN(v) && v >= 1 && v <= totalPages) {

          document.getElementById('jumpCurBadge').textContent = v;
        }
      });

      document.querySelectorAll('.jump-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          var target = chip.dataset.target;
          var pageVal = 1;
          if (target === 'first') pageVal = 1;
          else if (target === 'last') pageVal = totalPages;
          else if (target === '25') pageVal = Math.max(1, Math.round(totalPages * 0.25));
          else if (target === '50') pageVal = Math.max(1, Math.round(totalPages * 0.50));
          else if (target === '75') pageVal = Math.max(1, Math.round(totalPages * 0.75));

          jumpPageInput.value = pageVal;
          jumpScrubber.value = pageVal;
          document.getElementById('jumpCurBadge').textContent = pageVal;
        });
      });

      jumpCancelBtn.addEventListener('click', function () {
        jumpModal.classList.remove('active');
      });

      jumpModal.addEventListener('click', function (e) {
        if (e.target === jumpModal) jumpModal.classList.remove('active');
      });

      function submitJump() {
        var val = parseInt(jumpPageInput.value, 10);
        if (!isNaN(val) && val >= 1 && val <= totalPages) {
          jumpModal.classList.remove('active');
          scrollToPage(val, true); // Instant jump!
        }
      }
      jumpGoBtn.addEventListener('click', submitJump);
      jumpPageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitJump();
        else if (e.key === 'Escape') jumpModal.classList.remove('active');
      });

      document.getElementById('retryBtn').addEventListener('click', loadDocument);

      // Keyboard navigation
      window.addEventListener('keydown', function (e) {
        if (jumpModal.classList.contains('active')) return;
        var key = e.key.toLowerCase();

        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          scrollToPage(currentPage - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault();
          scrollToPage(currentPage + 1);
        } else if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          applySmoothScale(currentScale * 1.2, null, null, false);
          showToast('Zoom: ' + Math.round(currentScale * 100) + '%');
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          applySmoothScale(currentScale * 0.833, null, null, false);
          showToast('Zoom: ' + Math.round(currentScale * 100) + '%');
        } else if (e.key === '0') {
          e.preventDefault();
          toggleFitZoom();
        } else if (key === 'f') {
          e.preventDefault();
          toggleFullscreen();
        } else if (key === 't' || key === 'e') {
          e.preventDefault();
          cycleFilterMode();
        } else if (e.key === 'Home') {
          e.preventDefault();
          scrollToPage(1, true);
        } else if (e.key === 'End') {
          e.preventDefault();
          scrollToPage(totalPages, true);
        }
      });

      // Window resize adaptation
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          var isDesktop = (container.clientWidth || window.innerWidth) >= 840;
          var defScale = isDesktop ? getFitHeightScale() : getFitWidthScale();
          if (Math.abs(currentScale - defScale) < 0.15) {
            applySmoothScale(defScale);
          }
        }, 200);
      });

      loadDocument();
    })();
  </script>
</body>
</html>
