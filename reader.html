<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://d198y4z1gpgoxg.cloudfront.net;">
  <title>Academic Reader — SGOU</title>
  <style>
    /* ============================================================
       THEME SYSTEM — Synchronized with SGOU Academic Design Tokens
       ============================================================ */
    :root, html[data-theme="light"] {
      color-scheme: light;
      --bg: #ebe4d6;
      --surface: #ffffff;
      --surface-subtle: #f5f0e8;
      --surface-border: #d4cdc0;
      --text: #181512;
      --text-muted: #6b6357;
      --accent: #b43d28;
      --accent-hover: #96311e;
      --toolbar-bg: rgba(245, 240, 232, 0.94);
      --toolbar-border: rgba(212, 205, 192, 0.9);
      --toolbar-text: #181512;
      --toolbar-btn-hover: rgba(180, 61, 40, 0.1);
      --canvas-shadow: 0 4px 20px rgba(26, 23, 20, 0.12);
      --placeholder-bg: #e2dbce;
      --placeholder-text: #82796e;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141210;
      --surface: #1e1b18;
      --surface-subtle: #24221f;
      --surface-border: #38322c;
      --text: #f0ede8;
      --text-muted: #a39e95;
      --accent: #e5725a;
      --accent-hover: #f28b75;
      --toolbar-bg: rgba(30, 27, 24, 0.94);
      --toolbar-border: rgba(56, 50, 44, 0.9);
      --toolbar-text: #f0ede8;
      --toolbar-btn-hover: rgba(255, 255, 255, 0.12);
      --canvas-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
      --placeholder-bg: #24201c;
      --placeholder-text: #787168;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    #readerWrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Top Reading Progress Bar */
    #readingProgressWrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(0, 0, 0, 0.08);
      z-index: 120;
      cursor: pointer;
    }
    #readingProgressBar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.08s ease;
      box-shadow: 0 0 6px var(--accent);
    }

    /* Scrollable Container with generous bottom clearance */
    #viewerContainer {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      display: flex;
      flex-direction: column;
      align-items: center;
      align-items: safe center;
      padding: 16px 10px calc(80px + env(safe-area-inset-bottom, 0px)) 10px;
      gap: 16px;
      scroll-behavior: auto;
      touch-action: pan-x pan-y;
    }

    #viewerContainer.is-zooming-interactive {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Page Canvas Wrappers */
    .pdf-page-wrap {
      position: relative;
      background: #ffffff;
      box-shadow: var(--canvas-shadow);
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
      flex-shrink: 0;
      transition: box-shadow 0.2s ease, width 0.15s cubic-bezier(0.16, 1, 0.3, 1), height 0.15s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
      transform-origin: center top;
      will-change: width, height;
    }

    html[data-theme="dark"] .pdf-page-wrap,
    #viewerContainer.filter-dark .pdf-page-wrap {
      background: #141210;
    }

    /* Instant 60fps tracking during live touch pinch or wheel zoom gestures (no transition lag) */
    #viewerContainer.is-zooming-interactive .pdf-page-wrap {
      transition: none !important;
    }

    .pdf-page-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .page-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--placeholder-bg);
      color: var(--placeholder-text);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .page-skeleton-pulse {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--placeholder-text);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      opacity: 0.7;
    }

    /* Floating Toolbar */
    #bottomBar {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--toolbar-border);
      padding: 5px 9px;
      border-radius: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.22);
      z-index: 100;
      max-width: 96vw;
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.26s ease;
    }

    #bottomBar.bar-hidden {
      transform: translate(-50%, calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }

    .bar-btn {
      background: transparent;
      border: none;
      color: var(--toolbar-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }
    .bar-btn:hover {
      background: var(--toolbar-btn-hover);
      color: var(--accent);
    }
    .bar-btn:active {
      transform: scale(0.92);
    }
    .bar-btn:disabled, .bar-btn[aria-disabled="true"] {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .page-info-btn {
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--toolbar-text);
      padding: 4px 8px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .page-info-btn:hover {
      background: var(--toolbar-btn-hover);
    }
    #zoomPresetBtn {
      min-width: 44px;
      justify-content: center;
      font-size: 12px;
    }

    .bar-divider {
      width: 1px;
      height: 18px;
      background: var(--toolbar-border);
      margin: 0 2px;
    }

    /* Jump to Page Modal Dialog */
    #jumpModal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 150;
      padding: 16px;
    }
    #jumpModal.active {
      display: flex;
    }
    .jump-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      max-width: 320px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
      animation: jumpPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes jumpPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .jump-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .jump-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .jump-current-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
    }
    .jump-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .jump-input {
      flex: 1;
      padding: 9px 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      background: var(--surface-subtle);
      color: var(--text);
      outline: none;
      text-align: center;
    }
    .jump-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(180, 61, 40, 0.2);
    }
    .jump-total-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .jump-scrubber-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .jump-scrubber {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
    }
    .jump-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .jump-chip {
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .jump-chip:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .jump-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }
    .jump-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }
    .jump-btn-cancel {
      background: transparent;
      color: var(--text-muted);
    }
    .jump-btn-go {
      background: var(--accent);
      color: #ffffff;
    }

    /* Minimal Toast Notifications */
    #readerToast {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--toolbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--toolbar-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      z-index: 180;
      white-space: nowrap;
    }
    #readerToast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Loading Overlay */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      z-index: 200;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(180, 61, 40, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      max-width: 280px;
    }

    #errorBox {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
    }
    .error-title {
      font-size: 15px;
      font-weight: 600;
      color: #dc2626;
    }
    .retry-btn {
      padding: 8px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* Eye-Comfort Filter Classes */
    #viewerContainer.filter-sepia canvas {
      filter: sepia(0.38) contrast(0.96) brightness(0.96);
    }
    #viewerContainer.filter-dark canvas {
      filter: invert(0.88) hue-rotate(180deg) brightness(0.95) contrast(1.05);
      background: #141210;
    }

    /* Upstream Mismatch Notice Banner */
    #readerMismatchBanner {
      position: sticky;
      top: 0;
      z-index: 110;
      width: 100%;
      background: rgba(245, 158, 11, 0.15);
      border-bottom: 1px solid rgba(245, 158, 11, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.4;
      animation: slideDown .2s ease;
    }
    .mismatch-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
    }
    .mismatch-inner svg {
      color: #d97706;
      flex-shrink: 0;
    }
    html[data-theme="dark"] .mismatch-inner svg {
      color: #fbbf24;
    }
    .mismatch-text {
      flex: 1;
    }
    .mismatch-text strong {
      color: #b45309;
      margin-right: 4px;
    }
    html[data-theme="dark"] .mismatch-text strong {
      color: #fcd34d;
    }
    .mismatch-report-btn {
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.2);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .mismatch-report-btn:hover {
      background: rgba(245, 158, 11, 0.35);
    }
    .mismatch-dismiss-btn {
      background: none;
      border: none;
      font-size: 18px;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .mismatch-dismiss-btn:hover {
      color: var(--text);
    }

    /* Report Modal Dialog */
    #reportModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #reportModal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .report-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] .report-card {
      background: #18181b;
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
    }
    #reportModal.active .report-card {
      transform: scale(1);
    }
    .report-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px 11px;
      border-bottom: 1px solid var(--surface-border);
      background: var(--surface-subtle);
    }
    [data-theme="dark"] .report-card-header {
      background: rgba(255, 255, 255, 0.02);
      border-bottom-color: rgba(255, 255, 255, 0.07);
    }
    .report-header-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }
    .report-header-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .report-header-title svg {
      color: var(--accent);
      flex-shrink: 0;
    }
    .report-header-subtitle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .report-header-subtitle .reader-report-doc-title {
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .report-header-subtitle .report-doc-sep {
      opacity: 0.5;
      flex-shrink: 0;
    }
    .report-header-subtitle .reader-report-doc-meta {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .report-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
      flex-shrink: 0;
    }
    .report-close-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }
    .report-close-btn:focus {
      outline: none;
    }
    .report-close-btn:focus-visible {
      outline: 2px solid var(--accent);
    }
    .report-card-body {
      padding: 13px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .report-field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .report-field-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .report-label-opt {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 11px;
    }
    .report-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .report-select {
      width: 100%;
      height: 35px;
      padding: 0 30px 0 10px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 7px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    [data-theme="dark"] .report-select {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .report-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(180, 61, 40, 0.15);
    }
    .report-select-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      color: var(--text-muted);
    }
    .report-input {
      width: 100%;
      height: 35px;
      padding: 0 10px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 7px;
      box-sizing: border-box;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    [data-theme="dark"] .report-input {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .report-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(180, 61, 40, 0.15);
    }
    .report-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }
    .report-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--surface-border);
      background: var(--surface-subtle);
    }
    [data-theme="dark"] .report-modal-footer {
      background: rgba(255, 255, 255, 0.02);
      border-top-color: rgba(255, 255, 255, 0.07);
    }
    .report-footer-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .report-tool-btn {
      background: transparent;
      border: 1px solid var(--surface-border);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all .14s ease;
    }
    [data-theme="dark"] .report-tool-btn {
      border-color: rgba(255, 255, 255, 0.1);
    }
    .report-tool-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }
    .report-tool-btn.whatsapp-tool-btn {
      color: #16a34a;
    }
    [data-theme="dark"] .report-tool-btn.whatsapp-tool-btn {
      color: #22c55e;
    }
    .report-tool-btn.whatsapp-tool-btn:hover {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
    }
    .report-footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .report-cancel-btn {
      background: transparent;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .14s ease;
    }
    .report-cancel-btn:hover {
      color: var(--text);
      background: var(--surface-subtle);
    }
    .report-submit-btn {
      height: 33px;
      padding: 0 14px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s ease;
      box-shadow: 0 1px 4px rgba(180, 61, 40, 0.2);
    }
    .report-submit-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(180, 61, 40, 0.28);
    }
    .report-submit-btn:active {
      transform: translateY(0);
    }
    .report-submit-btn.submitting {
      opacity: 0.85;
      cursor: wait;
    }
    .report-submit-btn.success {
      background: #10b981 !important;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
    }
    .report-submit-btn.whatsapp-primary {
      background: #16a34a !important;
      box-shadow: 0 1px 4px rgba(22, 163, 74, 0.25) !important;
    }
    .report-submit-btn.whatsapp-primary:hover {
      background: #15803d !important;
      box-shadow: 0 3px 8px rgba(22, 163, 74, 0.35) !important;
    }
    [data-theme="dark"] .report-submit-btn.whatsapp-primary {
      background: #15803d !important;
      box-shadow: 0 1px 4px rgba(21, 128, 61, 0.3) !important;
    }
    [data-theme="dark"] .report-submit-btn.whatsapp-primary:hover {
      background: #16a34a !important;
      box-shadow: 0 3px 8px rgba(22, 163, 74, 0.4) !important;
    }
  </style>
</head>
<body>
  <div id="readerWrap">
    <!-- Top Reading Progress Indicator -->
    <div id="readingProgressWrap" title="Reading progress — click anywhere to seek">
      <div id="readingProgressBar"></div>
    </div>

    <!-- Toast Notification -->
    <div id="readerToast"></div>

    <!-- Initial Loader -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingMsg">Preparing document preview&hellip;</div>
      <div id="errorBox">
        <div class="error-title" id="errorMsg">Could not load document</div>
        <button type="button" class="retry-btn" id="retryBtn">Retry</button>
      </div>
    </div>

    <!-- Upstream University Mismatch Alert Banner -->
    <div id="readerMismatchBanner" style="display:none;" role="alert">
      <div class="mismatch-inner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <div class="mismatch-text">
          <strong id="readerMismatchBadge">University Portal Error:</strong>
          <span id="readerMismatchDesc">SGOU portal uploaded the wrong question paper under this course link.</span>
        </div>
        <button type="button" class="mismatch-report-btn" id="readerMismatchReportBtn">Report / Help</button>
        <button type="button" class="mismatch-dismiss-btn" id="readerMismatchDismissBtn" aria-label="Dismiss banner">&times;</button>
      </div>
    </div>

    <!-- Scrollable Pages Viewport -->
    <div id="viewerContainer"></div>

    <!-- Floating Navigation Bar -->
    <div id="bottomBar">
      <button type="button" class="bar-btn" id="prevBtn" title="Previous page (Left Arrow)" aria-label="Previous page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <button type="button" class="page-info-btn" id="pageJumpBtn" title="Click to jump or scrub through pages" aria-label="Jump to page">
        <span id="pageNum">1</span> / <span id="pageCount">&ndash;</span>
      </button>

      <button type="button" class="bar-btn" id="nextBtn" title="Next page (Right Arrow)" aria-label="Next page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="bar-divider"></div>

      <button type="button" class="bar-btn" id="zoomOutBtn" title="Zoom Out (-)" aria-label="Zoom out">

      </button>

      <button type="button" class="page-info-btn" id="zoomPresetBtn" title="Zoom Level (Click to toggle Fit Page / Fit Width)" aria-label="Zoom level">
        <span id="zoomPresetText">100%</span>

      <button type="button" class="bar-btn" id="zoomInBtn" title="Zoom In (+)" aria-label="Zoom in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <div class="bar-divider"></div>

      <!-- Eye-Comfort Reading Mode Toggle (Normal -> Sepia -> Dark) -->
      <button type="button" class="bar-btn" id="filterBtn" title="Eye-Comfort Reading Mode (T)" aria-label="Eye-comfort mode">
        <svg id="filterIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>

      <!-- Document Issue Report Button -->
      <button type="button" class="bar-btn" id="reportBtn" title="Report Issue with Document (R)" aria-label="Report issue">

        <svg id="fullscreenIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>

    <!-- Quick Jump & Visual Scrubber Modal Dialog -->

              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12.031 2C6.496 2 2 6.494 2 12.029c0 1.93.548 3.738 1.498 5.275L2 22l4.832-1.454A9.974 9.974 0 0 0 12.031 22C17.566 22 22 17.506 22 12.029 22 6.494 17.566 2 12.031 2zm5.727 14.168c-.24.673-1.393 1.288-1.928 1.343-.49.05-1.127.08-3.32-.828-2.618-1.082-4.294-3.757-4.425-3.931-.13-.174-1.054-1.402-1.054-2.674 0-1.272.668-1.897.906-2.155.239-.258.522-.323.696-.323.174 0 .348.002.5.01.163.008.382-.062.597.455.228.549.773 1.884.84 2.022.066.138.11.3.022.474-.088.174-.131.283-.262.434-.13.151-.274.337-.392.454-.13.13-.265.272-.114.531.151.26 1.058 1.737 2.272 2.818 1.562 1.39 2.878 1.82 3.287 2.022.409.202.648.169.887-.109.239-.278 1.026-1.196 1.301-1.606.275-.41.55-.342.923-.203.373.138 2.36 1.112 2.765 1.314.405.202.675.303.774.474.098.172.098.998-.142 1.671z"/>
