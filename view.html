<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Loading... — SGOU SLM</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f5f0e8;
            --bg-deep: #ebe4d6;
            --surface: #ffffff;
            --surface-hover: #faf7f1;
            --accent: #b8432f;
            --accent-hover: #9e3824;
            --accent-light: #d4654f;
            --ink: #1a1714;
            --ink-soft: #4a4540;
            --ink-muted: #6b6358;
            --border: #d6cfc2;
            --border-light: #e2ddd4;
            --ug: #1f5a43;
            --pg: #5e3370;
            --fyug: #235090;
            --ug-bg: rgba(31, 90, 67, 0.12);
            --pg-bg: rgba(94, 51, 112, .12);
            --fyug-bg: rgba(35, 80, 144, .12);
            --shadow-sm: 0 1px 3px rgba(26, 23, 20, .06);
            --shadow: 0 2px 10px rgba(26, 23, 20, .08);
            --shadow-lg: 0 8px 30px rgba(26, 23, 20, .12);
            --header-bg: #1a1714;
            --header-text: #f5f0e8;
            --header-sub: #a09888;
            --toast-bg: #1a1714;
            --toast-text: #f5f0e8;
            --focus-ring: rgba(184, 67, 47, .35);
            --radius: 10px;
            --radius-sm: 6px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        [data-theme="dark"] {
            --bg: #0e0d0c;
            --bg-deep: #171614;
            --surface: #1c1b19;
            --surface-hover: #252420;
            --accent: #e06b52;
            --accent-hover: #f08a72;
            --accent-light: #f08a72;
            --ink: #ece8e0;
            --ink-soft: #b0a898;
            --ink-muted: #8a8278;
            --border: #302e2a;
            --border-light: #282622;
            --ug: #008552;
            --pg: #9102ce;
            --fyug: #0354c5;
            --ug-bg: rgba(31, 90, 67, .25);
            --pg-bg: rgba(94, 51, 112, .25);
            --fyug-bg: rgba(35, 80, 144, .25);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, .2);
            --shadow: 0 2px 10px rgba(0, 0, 0, .3);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, .4);
            --header-bg: #080706;
            --header-text: #ece8e0;
            --header-sub: #8a8278;
            --toast-bg: #ece8e0;
            --toast-text: #0e0d0c;
            --focus-ring: rgba(224, 107, 82, .35);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            height: 100%;
        }

        body {
            font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            background: var(--bg);
            color: var(--ink);
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===========================
           COMPACT TOPBAR
           =========================== */
        .topbar {
            background: var(--header-bg);
            color: var(--header-text);
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            transition: background .3s;
        }

        .topbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--accent));
        }

        /* Always-visible compact bar */
        .topbar-compact {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .45rem .75rem;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: .35rem;
            text-decoration: none;
            color: var(--header-text);
            flex-shrink: 0;
        }

        .topbar-brand svg {
            width: 22px;
            height: 22px;
        }

        .topbar-brand span {
            font-family: 'DM Serif Display', serif;
            font-size: 13px;
            white-space: nowrap;
        }

        .topbar-title {
            flex: 1;
            min-width: 0;
            font-family: 'DM Serif Display', serif;
            font-size: 13px;
            font-weight: 400;
            color: var(--header-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .topbar-code {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--header-sub);
            background: rgba(255, 255, 255, .08);
            padding: .1rem .3rem;
            border-radius: 3px;
            letter-spacing: .04em;
            flex-shrink: 0;
            display: none;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: .25rem;
            flex-shrink: 0;
        }

        .topbar-btn {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .05);
            color: var(--header-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, border-color .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            font-size: 0;
        }

        .topbar-btn:hover {
            background: rgba(255, 255, 255, .15);
            border-color: rgba(255, 255, 255, .25);
        }

        .topbar-btn:active {
            transform: scale(.9);
        }

        .topbar-btn.accent-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .topbar-btn.accent-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .topbar-btn.accent-btn.downloading {
            opacity: .6;
            pointer-events: none;
        }

        .expand-toggle {
            width: 30px;
            height: 30px;
        }

        .expand-toggle svg {
            transition: transform .25s var(--ease);
        }

        .topbar.expanded .expand-toggle svg {
            transform: rotate(180deg);
        }

        /* Expandable detail panel */
        .topbar-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s var(--ease);
        }

        .topbar.expanded .topbar-details {
            max-height: 200px;
        }

        .topbar-details-inner {
            padding: .5rem .75rem .65rem;
            border-top: 1px solid rgba(255, 255, 255, .08);
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: .4rem;
            flex-wrap: wrap;
            margin-bottom: .3rem;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--header-sub);
            letter-spacing: .06em;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .detail-value {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--header-text);
            word-break: break-all;
        }

        .detail-level {
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .1rem .35rem;
            border-radius: 3px;
        }

        .detail-level.ug {
            background: rgba(31, 90, 67, .35);
            color: #6fd4a8;
        }

        .detail-level.pg {
            background: rgba(94, 51, 112, .35);
            color: #c77dff;
        }

        .detail-level.fyug {
            background: rgba(35, 80, 144, .35);
            color: #6ea8fe;
        }

        .detail-actions {
            display: flex;
            gap: .3rem;
            margin-top: .45rem;
            flex-wrap: wrap;
        }

        .detail-btn {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: .32rem .6rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, .15);
            background: rgba(255, 255, 255, .06);
            color: var(--header-text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .25rem;
            text-decoration: none;
            transition: background .15s, border-color .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }

        .detail-btn:hover {
            background: rgba(255, 255, 255, .15);
            border-color: rgba(255, 255, 255, .3);
        }

        .detail-btn:active {
            transform: scale(.95);
        }

        /* ===========================
           PDF VIEWER (full remaining space)
           =========================== */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
            background: var(--bg);
        }

        /* Loading */
        .viewer-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            color: var(--ink-muted);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            letter-spacing: .04em;
            z-index: 10;
            background: var(--bg);
        }

        .viewer-loading.hidden {
            display: none;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */
        .viewer-error {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            color: var(--ink-muted);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            text-align: center;
            padding: 2rem;
            background: var(--bg);
            z-index: 20;
        }

        .viewer-error.visible {
            display: flex;
        }

        .viewer-error svg {
            opacity: .35;
        }

        .viewer-error a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            border: 1px solid var(--accent);
            padding: .35rem .7rem;
            border-radius: 4px;
            margin-top: .3rem;
            transition: background .2s, color .2s;
        }

        .viewer-error a:hover {
            background: var(--accent);
            color: #fff;
        }

        /* iframe wrapper */
        .iframe-wrap {
            flex: 1;
            min-height: 0;
            display: none;
        }

        .iframe-wrap.visible {
            display: block;
        }

        .iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Object fallback */
        .iframe-wrap object {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===========================
           BOTTOM BAR (mobile quick actions)
           =========================== */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .3rem;
            padding: .4rem .75rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 50;
            padding-bottom: calc(.4rem + env(safe-area-inset-bottom));
        }

        .bottom-btn {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: .4rem .7rem;
            border-radius: 5px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            text-decoration: none;
            transition: background .15s, color .15s, border-color .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .bottom-btn:active {
            transform: scale(.95);
        }

        .bottom-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .bottom-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .bottom-btn.primary.downloading {
            opacity: .6;
            pointer-events: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 4.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--toast-bg);
            color: var(--toast-text);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            letter-spacing: .04em;
            padding: .5rem 1rem;
            border-radius: 6px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: opacity .3s var(--ease), transform .3s var(--ease);
            z-index: 10001;
            pointer-events: none;
            white-space: nowrap;
            max-width: 88vw;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===========================
           RESPONSIVE: TABLET+
           =========================== */
        @media (min-width: 768px) {
            .topbar-code {
                display: inline-block;
            }

            .topbar-title {
                font-size: 14px;
            }

            .topbar-compact {
                padding: .5rem 1rem;
            }

            .topbar-details-inner {
                padding: .6rem 1rem .75rem;
            }

            .bottom-bar {
                padding: .5rem 1rem;
            }
        }

        /* ===========================
           RESPONSIVE: LANDSCAPE
           =========================== */
        @media (max-height: 500px) and (orientation: landscape) {
            .topbar-compact {
                padding: .3rem .75rem;
            }

            .topbar-brand svg {
                width: 18px;
                height: 18px;
            }

            .topbar-brand span {
                display: none;
            }

            .bottom-bar {
                padding: .25rem .75rem;
            }

            .bottom-btn {
                padding: .3rem .55rem;
                font-size: 10px;
            }
        }

        /* ===========================
           PWA STANDALONE
           =========================== */
        @media (display-mode: standalone) {
            .topbar-compact {
                padding-top: calc(.45rem + env(safe-area-inset-top));
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Print */
        @media print {

            .topbar,
            .bottom-bar,
            .viewer-loading,
            .viewer-error,
            .toast {
                display: none !important;
            }

            .iframe-wrap {
                display: block !important;
            }

            .viewer-area {
                position: static;
            }
        }
    </style>
</head>

<body>

    <!-- ============ COMPACT TOPBAR ============ -->
    <div class="topbar" id="topbar">
        <div class="topbar-compact">
            <a class="topbar-brand" href="./">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                    <rect width="512" height="512" rx="108" fill="var(--accent)" />
                    <rect x="72" y="365" width="368" height="10" rx="5" fill="#fff" opacity=".4" />
                    <text x="256" y="290" font-family="Georgia,serif" font-size="210" font-weight="bold" fill="#fff"
                        text-anchor="middle" dominant-baseline="central">SG</text>
                </svg>
                <span>SLM Browser</span>
            </a>

            <span class="topbar-title" id="topbarTitle">Loading...</span>
            <span class="topbar-code" id="topbarCode"></span>

            <div class="topbar-actions">
                <button class="topbar-btn accent-btn" id="topbarDownload" aria-label="Download PDF"
                    title="Download PDF">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                </button>
                <button class="topbar-btn expand-toggle" id="expandToggle" aria-label="Show details"
                    title="Show details">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="topbar-details" id="topbarDetails">
            <div class="topbar-details-inner">
                <div class="detail-row">
                    <span class="detail-label">Programme</span>
                    <span class="detail-value" id="detailProg"></span>
                    <span class="detail-level" id="detailLevel"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Course</span>
                    <span class="detail-value" id="detailCourse"></span>
                </div>
                <div class="detail-actions">
                    <a class="detail-btn" id="btnOpenDirect" href="#" target="_blank" rel="noopener">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                            <polyline points="15 3 21 3 21 9" />
                            <line x1="10" y1="14" x2="21" y2="3" />
                        </svg>
                        Open Original
                    </a>
                    <a class="detail-btn" href="./">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Browse All
                    </a>
                    <button class="detail-btn" id="btnCopyLink">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        Copy Link
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ PDF VIEWER ============ -->
    <div class="viewer-area">
        <div class="viewer-loading" id="viewerLoading">
            <div class="loading-spinner"></div>
            <span>Loading PDF...</span>
        </div>

        <div class="viewer-error" id="viewerError">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <p id="errorText">Could not load PDF.</p>
            <a id="errorDownload" href="#" target="_blank" rel="noopener">Download Directly</a>
        </div>

        <div class="iframe-wrap" id="iframeWrap">
            <iframe id="pdfFrame" title="PDF Viewer" loading="eager"></iframe>
        </div>
    </div>

    <!-- ============ BOTTOM BAR ============ -->
    <div class="bottom-bar">
        <a class="bottom-btn" href="./">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Browse
        </a>
        <button class="bottom-btn primary" id="bottomDownload">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download
        </button>
        <button class="bottom-btn" id="bottomShare">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
            </svg>
            Share
        </button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            var hash = window.location.hash.slice(1);
            var params = new URLSearchParams(window.location.search);

            // Support both: #COURSECODE (clean) and ?url=...&name=... (legacy)
            var courseCode = decodeURIComponent(hash || '');
            var pdfUrl = params.get('url') || '';
            var name = params.get('name') || '';
            var code = params.get('code') || courseCode;
            var prog = params.get('prog') || '';
            var level = params.get('level') || '';

            var loading = document.getElementById('viewerLoading');
            var errorEl = document.getElementById('viewerError');
            var errorTxt = document.getElementById('errorText');
            var frame = document.getElementById('pdfFrame');
            var titleEl = document.getElementById('courseTitle');
            var metaEl = document.getElementById('courseMeta');
            var dlBtn = document.getElementById('directDownload');
            var openBtn = document.getElementById('openDirect');

            // ============================================
            // PWA AUTO-REDIRECT
            // ============================================
            var isStandalone = window.matchMedia('(display-mode:standalone)').matches
                || window.navigator.standalone === true;

            if (isStandalone && courseCode) {
                window.location.replace('./#/view/' + encodeURIComponent(courseCode));
                return;
            }

            // ============================================
            // If we have a course code but no PDF URL,
            // load data to look up the course
            // ============================================
            if (courseCode && !pdfUrl) {
                titleEl.textContent = 'Loading\u2026';

                // Use absolute URLs so it works regardless of deployment path
                var dataUrls = [
                    location.origin + '/sgou_slm_data.json',
                    location.origin + '/data.json'
                ];

                tryNext(0);

            } else if (pdfUrl) {
                showCourse();
            } else {
                showError('No course code or PDF URL provided.');
            }

            function tryNext(idx) {
                if (idx >= dataUrls.length) {
                    showError('Course "' + courseCode + '" could not be found. Data unavailable.');
                    return;
                }

                fetch(dataUrls[idx])
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        // Verify it's actually JSON, not an HTML error page
                        var ct = r.headers.get('content-type') || '';
                        if (ct.indexOf('json') === -1 && ct.indexOf('octet') === -1) {
                            throw new Error('Not JSON');
                        }
                        return r.json();
                    })
                    .then(function (data) {
                        if (!Array.isArray(data)) throw new Error('Not an array');

                        var found = null;
                        data.forEach(function (p) {
                            (p.semesters || []).forEach(function (s) {
                                (s.courses || []).forEach(function (c) {
                                    if (c.code === courseCode) {
                                        found = {
                                            pdfUrl: c.pdf_url,
                                            name: c.name,
                                            code: c.code,
                                            prog: p.programme_name,
                                            level: p.level
                                        };
                                    }
                                });
                            });
                        });

                        if (!found) {
                            showError('Course "' + courseCode + '" not found in database.');
                            return;
                        }

                        name = found.name;
                        code = found.code;
                        prog = found.prog;
                        level = found.level;
                        pdfUrl = found.pdfUrl;

                        showCourse();
                    })
                    .catch(function () {
                        tryNext(idx + 1);
                    });
            }

            function showCourse() {
                if (!pdfUrl) {
                    showError('PDF URL not available for this course.');
                    return;
                }

                document.title = (name || 'PDF') + ' \u2014 SGOU SLM';
                titleEl.textContent = name || 'Course PDF';

                var cls = level === 'PG' ? 'pg' : level === 'UG' ? 'ug' : 'fyug';
                var label = level === 'FYUG' ? 'FYUG' : level;
                var m = '';
                if (prog) m += '<span>' + escH(prog) + '</span>';
                if (level) m += '<span class="viewer-meta-tag ' + cls + '">' + label + '</span>';
                if (code) m += '<span>Code: ' + escH(code) + '</span>';
                metaEl.innerHTML = m;

                dlBtn.href = pdfUrl;
                dlBtn.download = (code ? code + '_' : '') + (name || 'document').replace(/[^a-zA-Z0-9 _\-]/g, '') + '.pdf';
                openBtn.href = pdfUrl;
                var errDl = document.getElementById('errorDownload');
                if (errDl) errDl.href = pdfUrl;

                loadPDF(pdfUrl);
            }

            function loadPDF(url) {
                var done = false;
                function ready() {
                    if (done) return;
                    done = true;
                    loading.style.display = 'none';
                    frame.style.display = 'block';
                }

                var gview = 'https://docs.google.com/gview?url=' + encodeURIComponent(url) + '&embedded=true';
                frame.src = gview;
                frame.addEventListener('load', ready);
                setTimeout(function () { if (!done) frame.src = url; }, 5000);
                setTimeout(ready, 9000);
            }

            function showError(msg) {
                loading.style.display = 'none';
                errorTxt.textContent = msg;
                errorEl.style.display = 'flex';
            }

            function escH(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // Theme sync
            try {
                var saved = localStorage.getItem('sgou-theme');
                if (saved) document.documentElement.setAttribute('data-theme', saved);
            } catch (_) { }
        })();
    </script>

</body>

</html>
