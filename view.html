<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Loading... — SGOU SLM</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f5f0e8;
            --bg-deep: #ebe4d6;
            --surface: #ffffff;
            --surface-hover: #faf7f1;
            --accent: #b8432f;
            --accent-hover: #9e3824;
            --accent-light: #d4654f;
            --ink: #1a1714;
            --ink-soft: #4a4540;
            --ink-muted: #6b6358;
            --border: #d6cfc2;
            --border-light: #e2ddd4;
            --ug: #1f5a43;
            --pg: #5e3370;
            --fyug: #235090;
            --ug-bg: rgba(31, 90, 67, 0.12);
            --pg-bg: rgba(94, 51, 112, .12);
            --fyug-bg: rgba(35, 80, 144, .12);
            --shadow-sm: 0 1px 3px rgba(26, 23, 20, .06);
            --shadow: 0 2px 10px rgba(26, 23, 20, .08);
            --shadow-lg: 0 8px 30px rgba(26, 23, 20, .12);
            --header-bg: #1a1714;
            --header-text: #f5f0e8;
            --header-sub: #a09888;
            --toast-bg: #1a1714;
            --toast-text: #f5f0e8;
            --focus-ring: rgba(184, 67, 47, .35);
            --radius: 10px;
            --radius-sm: 6px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        [data-theme="dark"] {
            --bg: #13110f;
            --bg-deep: #1b1916;
            --surface: #201e1a;
            --surface-hover: #2a2722;
            --accent: #e06b52;
            --accent-hover: #eb7f67;
            --accent-light: #f29782;
            --ink: #ece7de;
            --ink-soft: #b8b0a2;
            --ink-muted: #8c8375;
            --border: #36322b;
            --border-light: #2a2620;
            --ug: #34d399;
            --pg: #c084fc;
            --fyug: #60a5fa;
            --ug-bg: rgba(52, 211, 153, .16);
            --pg-bg: rgba(192, 132, 252, .16);
            --fyug-bg: rgba(96, 165, 250, .16);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3);
            --shadow: 0 4px 20px rgba(0, 0, 0, .4);
            --shadow-lg: 0 16px 45px rgba(0, 0, 0, .55);
            --header-bg: #0d0c0a;
            --header-text: #ece7de;
            --header-sub: #8c8375;
            --toast-bg: #ece7de;
            --toast-text: #13110f;
            --focus-ring: rgba(224, 107, 82, .35);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            height: 100%;
        }

        body {
            font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            background: var(--bg);
            color: var(--ink);
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===========================
           COMPACT TOPBAR
           =========================== */
        .topbar {
            background: var(--header-bg);
            color: var(--header-text);
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            transition: background .3s;
        }

        .topbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--accent));
        }

        /* Always-visible compact bar */
        .topbar-compact {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .45rem .75rem;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: .35rem;
            text-decoration: none;
            color: var(--header-text);
            flex-shrink: 0;
        }

        .topbar-brand svg {
            width: 22px;
            height: 22px;
        }

        .topbar-brand span {
            font-family: 'DM Serif Display', serif;
            font-size: 13px;
            white-space: nowrap;
        }

        .topbar-title {
            flex: 1;
            min-width: 0;
            font-family: 'DM Serif Display', serif;
            font-size: 13px;
            font-weight: 400;
            color: var(--header-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .topbar-code {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--header-sub);
            background: rgba(255, 255, 255, .08);
            padding: .1rem .3rem;
            border-radius: 3px;
            letter-spacing: .04em;
            flex-shrink: 0;
            display: none;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: .25rem;
            flex-shrink: 0;
        }

        .topbar-btn {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .05);
            color: var(--header-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, border-color .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            font-size: 0;
        }

        .topbar-btn:hover {
            background: rgba(255, 255, 255, .15);
            border-color: rgba(255, 255, 255, .25);
        }

        .topbar-btn:active {
            transform: scale(.9);
        }

        .topbar-btn.accent-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .topbar-btn.accent-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .topbar-btn.accent-btn.downloading {
            opacity: .6;
            pointer-events: none;
        }

        .expand-toggle {
            width: 30px;
            height: 30px;
        }

        .expand-toggle svg {
            transition: transform .25s var(--ease);
        }

        .topbar.expanded .expand-toggle svg {
            transform: rotate(180deg);
        }

        /* Expandable detail panel */
        .topbar-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height .3s var(--ease);
        }

        .topbar.expanded .topbar-details {
            max-height: 200px;
        }

        .topbar-details-inner {
            padding: .5rem .75rem .65rem;
            border-top: 1px solid rgba(255, 255, 255, .08);
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: .4rem;
            flex-wrap: wrap;
            margin-bottom: .3rem;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--header-sub);
            letter-spacing: .06em;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .detail-value {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--header-text);
            word-break: break-all;
        }

        .detail-level {
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .1rem .35rem;
            border-radius: 3px;
        }

        .detail-level.ug {
            background: rgba(31, 90, 67, .35);
            color: #6fd4a8;
        }

        .detail-level.pg {
            background: rgba(94, 51, 112, .35);
            color: #c77dff;
        }

        .detail-level.fyug {
            background: rgba(35, 80, 144, .35);
            color: #6ea8fe;
        }

        .detail-type {
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .1rem .35rem;
            border-radius: 3px;
        }

        .detail-type.slm {
            background: rgba(31, 90, 67, .35);
            color: #6fd4a8;
        }

        .detail-type.pyq {
            background: rgba(67, 56, 202, .35);
            color: #a5b4fc;
        }

        .detail-type.asgn {
            background: rgba(180, 83, 9, .35);
            color: #fcd34d;
        }

        .detail-actions {
            display: flex;
            gap: .3rem;
            margin-top: .45rem;
            flex-wrap: wrap;
        }

        .detail-btn {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: .32rem .6rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, .15);
            background: rgba(255, 255, 255, .06);
            color: var(--header-text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .25rem;
            text-decoration: none;
            transition: background .15s, border-color .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }

        .detail-btn:hover {
            background: rgba(255, 255, 255, .15);
            border-color: rgba(255, 255, 255, .3);
        }

        .detail-btn:active {
            transform: scale(.95);
        }

        /* ===========================
           PDF VIEWER (full remaining space)
           =========================== */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
            background: var(--bg);
        }

        /* Loading */
        .viewer-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            color: var(--ink-muted);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            letter-spacing: .04em;
            z-index: 10;
            background: var(--bg);
        }

        .viewer-loading.hidden {
            display: none;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Error */
        .viewer-error {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            color: var(--ink-muted);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            text-align: center;
            padding: 2rem;
            background: var(--bg);
            z-index: 20;
        }

        .viewer-error.visible {
            display: flex;
        }

        .viewer-error svg {
            opacity: .35;
        }

        .viewer-error a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            border: 1px solid var(--accent);
            padding: .35rem .7rem;
            border-radius: 4px;
            margin-top: .3rem;
            transition: background .2s, color .2s;
        }

        .viewer-error a:hover {
            background: var(--accent);
            color: #fff;
        }

        /* iframe wrapper */
        .iframe-wrap {
            flex: 1;
            min-height: 0;
            display: none;
        }

        .iframe-wrap.visible {
            display: block;
        }

        .iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Object fallback */
        .iframe-wrap object {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===========================
           BOTTOM BAR (mobile quick actions)
           =========================== */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .3rem;
            padding: .4rem .75rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 50;
            padding-bottom: calc(.4rem + env(safe-area-inset-bottom));
        }

        .bottom-btn {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: .4rem .7rem;
            border-radius: 5px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            text-decoration: none;
            transition: background .15s, color .15s, border-color .15s, transform .1s;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .bottom-btn:active {
            transform: scale(.95);
        }

        .bottom-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .bottom-btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .bottom-btn.primary.downloading {
            opacity: .6;
            pointer-events: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 4.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--toast-bg);
            color: var(--toast-text);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            letter-spacing: .04em;
            padding: .5rem 1rem;
            border-radius: 6px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: opacity .3s var(--ease), transform .3s var(--ease);
            z-index: 10001;
            pointer-events: none;
            white-space: nowrap;
            max-width: 88vw;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===========================
           RESPONSIVE: TABLET+
           =========================== */
        @media (min-width: 768px) {
            .topbar-code {
                display: inline-block;
            }

            .topbar-title {
                font-size: 14px;
            }

            .topbar-compact {
                padding: .5rem 1rem;
            }

            .topbar-details-inner {
                padding: .6rem 1rem .75rem;
            }

            .bottom-bar {
                padding: .5rem 1rem;
            }
        }

        /* ===========================
           RESPONSIVE: LANDSCAPE
           =========================== */
        @media (max-height: 500px) and (orientation: landscape) {
            .topbar-compact {
                padding: .3rem .75rem;
            }

            .topbar-brand svg {
                width: 18px;
                height: 18px;
            }

            .topbar-brand span {
                display: none;
            }

            .bottom-bar {
                padding: .25rem .75rem;
            }

            .bottom-btn {
                padding: .3rem .55rem;
                font-size: 10px;
            }
        }

        /* ===========================
           PWA STANDALONE
           =========================== */
        @media (display-mode: standalone) {
            .topbar-compact {
                padding-top: calc(.45rem + env(safe-area-inset-top));
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Print */
        @media print {

            .topbar,
            .bottom-bar,
            .viewer-loading,
            .viewer-error,
            .toast {
                display: none !important;
            }

            .iframe-wrap {
                display: block !important;
            }

            .viewer-area {
                position: static;
            }
        }
    </style>
</head>

<body>

    <!-- ============ COMPACT TOPBAR ============ -->
    <div class="topbar" id="topbar">
        <div class="topbar-compact">
            <a class="topbar-brand" href="./">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                    <rect width="512" height="512" rx="108" fill="var(--accent)" />
                    <rect x="72" y="365" width="368" height="10" rx="5" fill="#fff" opacity=".4" />
                    <text x="256" y="290" font-family="Georgia,serif" font-size="210" font-weight="bold" fill="#fff"
                        text-anchor="middle" dominant-baseline="central">SG</text>
                </svg>
                <span>SLM Browser</span>
            </a>

            <span class="topbar-title" id="topbarTitle">Loading...</span>
            <span class="topbar-code" id="topbarCode"></span>

            <div class="topbar-actions">
                <button class="topbar-btn accent-btn" id="topbarDownload" aria-label="Download PDF"
                    title="Download PDF">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                </button>
                <button class="topbar-btn expand-toggle" id="expandToggle" aria-label="Show details"
                    title="Show details">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="topbar-details" id="topbarDetails">
            <div class="topbar-details-inner">
                <div class="detail-row">
                    <span class="detail-label">Programme</span>
                    <span class="detail-value" id="detailProg"></span>
                    <span class="detail-level" id="detailLevel"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Course</span>
                    <span class="detail-value" id="detailCourse"></span>
                </div>
                <div class="detail-actions">
                    <a class="detail-btn" id="btnOpenDirect" href="#" target="_blank" rel="noopener">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                            <polyline points="15 3 21 3 21 9" />
                            <line x1="10" y1="14" x2="21" y2="3" />
                        </svg>
                        Open Original
                    </a>
                    <a class="detail-btn" href="./">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Browse All
                    </a>
                    <button class="detail-btn" id="btnCopyLink">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        Copy Link
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ PDF VIEWER ============ -->
    <div class="viewer-area">
        <div class="viewer-loading" id="viewerLoading">
            <div class="loading-spinner"></div>
            <span>Loading PDF...</span>
        </div>

        <div class="viewer-error" id="viewerError">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <p id="errorText">Could not load PDF.</p>
            <a id="errorDownload" href="#" target="_blank" rel="noopener">Download Directly</a>
        </div>

        <div class="iframe-wrap" id="iframeWrap">
            <iframe id="pdfFrame" title="PDF Viewer" loading="eager"></iframe>
        </div>
    </div>

    <!-- ============ BOTTOM BAR ============ -->
    <div class="bottom-bar">
        <a class="bottom-btn" href="./">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Browse
        </a>
        <button class="bottom-btn primary" id="bottomDownload">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download
        </button>
        <button class="bottom-btn" id="bottomShare">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
            </svg>
            Share
        </button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            var hash = window.location.hash.slice(1);
            var courseCode = decodeURIComponent(hash || '');
            var params = new URLSearchParams(window.location.search);

            var pdfUrl = params.get('url') || '';
            var name = params.get('name') || '';
            var code = params.get('code') || courseCode;
            var prog = params.get('prog') || '';
            var level = params.get('level') || '';
            var matType = params.get('type') || (params.get('examdate') ? 'PYQ' : (params.get('semester') && !code ? 'ASSIGNMENT' : 'SLM'));
            var examDate = params.get('examdate') || params.get('date') || '';
            var batch = params.get('batch') || '';

            var loading = document.getElementById('viewerLoading');
            var errorEl = document.getElementById('viewerError');
            var errorTxt = document.getElementById('errorText');
            var frame = document.getElementById('pdfFrame');
            var titleEl = document.getElementById('courseTitle');
            var metaEl = document.getElementById('courseMeta');
            var dlBtn = document.getElementById('directDownload');
            var openBtn = document.getElementById('openDirect');

            // ============================================
            // PWA AUTO-REDIRECT
            // ============================================
            var isStandalone = window.matchMedia('(display-mode:standalone)').matches
                || window.navigator.standalone === true;

            if (isStandalone && courseCode) {
                window.location.replace('./#/view/' + encodeURIComponent(courseCode));
                return;
            }

            // ============================================
            // Resolve course from data if we only have a code
            // ============================================
            if (courseCode && !pdfUrl) {
                titleEl.textContent = 'Loading\u2026';

                var dataPaths = ['./data/sgou_slm_data.json', '/data/sgou_slm_data.json', '/sgou_slm_data.json', '/data.json'];
                tryFetch(0);
            } else if (pdfUrl) {
                showCourse();
            } else {
                showError('No course code or PDF URL provided.');
            }

            function tryFetch(i) {
                if (i >= dataPaths.length) {
                    showError('Could not load course data for "' + courseCode + '".');
                    return;
                }

                // Use relative paths — works on any deployment
                fetch(dataPaths[i], { cache: 'no-cache' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.text();
                    })
                    .then(function (text) {
                        // Guard: Vercel SPA may return HTML instead of JSON
                        var trimmed = text.trim();
                        if (trimmed.charAt(0) !== '[' && trimmed.charAt(0) !== '{') {
                            throw new Error('Not JSON');
                        }
                        return JSON.parse(trimmed);
                    })
                    .then(function (data) {
                        if (!Array.isArray(data)) throw new Error('Not an array');

                        var found = null;
                        data.forEach(function (p) {
                            (p.semesters || []).forEach(function (s) {
                                (s.courses || []).forEach(function (c) {
                                    if (c.code === courseCode) {
                                        found = {
                                            pdfUrl: c.pdf_url,
                                            name: c.name,
                                            code: c.code,
                                            prog: p.programme_name,
                                            level: p.level
                                        };
                                    }
                                });
                            });
                        });

                        if (!found) {
                            tryFetchQ(0);
                            return;
                        }

                        name = found.name;
                        code = found.code;
                        prog = found.prog;
                        level = found.level;
                        pdfUrl = found.pdfUrl;

                        showCourse();
                    })
                    .catch(function () {
                        if (i + 1 < dataPaths.length) {
                            tryFetch(i + 1);
                        } else {
                            tryFetchQ(0);
                        }
                    });
            }

            function tryFetchQ(j) {
                var qPaths = ['./data/sgou_questions_cleaned.json', '/data/sgou_questions_cleaned.json', '/sgou_questions_cleaned.json'];
                if (j >= qPaths.length) {
                    showError('Material "' + courseCode + '" not found in database.');
                    return;
                }
                fetch(qPaths[j], { cache: 'no-cache' })
                    .then(function(r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.text();
                    })
                    .then(function(text) {
                        var trimmed = text.trim();
                        if (trimmed.charAt(0) !== '[' && trimmed.charAt(0) !== '{') throw new Error('Not JSON');
                        return JSON.parse(trimmed);
                    })
                    .then(function(data) {
                        if (!Array.isArray(data)) throw new Error('Not array');
                        var foundQ = null;
                        var codeUp = courseCode.toUpperCase().trim();
                        data.forEach(function(p) {
                            (p.previous_year_questions || []).forEach(function(py) {
                                if (foundQ) return;
                                var subj = (py.subject_name || '').toUpperCase();
                                if (subj.includes(codeUp)) {
                                    foundQ = {
                                        pdfUrl: py.pdf_url,
                                        name: py.subject_name,
                                        code: courseCode,
                                        prog: p.course_title,
                                        level: p.course_title && (p.course_title.includes('M.') || p.course_title.includes('MASTER')) ? 'PG' : 'UG',
                                        examDate: py.exam_date,
                                        batch: py.admission_batch,
                                        type: 'PYQ'
                                    };
                                }
                            });
                        });
                        if (!foundQ) {
                            showError('Material "' + courseCode + '" not found in database.');
                            return;
                        }
                        name = foundQ.name;
                        code = foundQ.code;
                        prog = foundQ.prog;
                        level = foundQ.level;
                        pdfUrl = foundQ.pdfUrl;
                        examDate = foundQ.examDate;
                        batch = foundQ.batch;
                        matType = foundQ.type;
                        showCourse();
                    })
                    .catch(function() {
                        tryFetchQ(j + 1);
                    });
            }

            function showCourse() {
                if (!pdfUrl) {
                    showError('PDF URL not available for this course.');
                    return;
                }

                var typeLabel = matType === 'PYQ' ? 'PYQ Paper' : matType === 'ASSIGNMENT' ? 'Assignment' : 'Course SLM';
                document.title = (name || 'PDF') + ' (' + typeLabel + ') \u2014 SGOU Database';
                titleEl.textContent = name || 'Course Material';

                var cls = level === 'PG' ? 'pg' : level === 'UG' ? 'ug' : 'fyug';
                var label = level === 'FYUG' ? 'FYUG' : level;
                var typeCls = matType === 'PYQ' ? 'pyq' : matType === 'ASSIGNMENT' ? 'asgn' : 'slm';

                var m = '';
                if (prog) m += '<span>' + escH(prog) + '</span>';
                if (level) m += '<span class="viewer-meta-tag ' + cls + '">' + label + '</span>';
                m += '<span class="detail-type ' + typeCls + '">' + typeLabel + '</span>';
                if (code) m += '<span>Code: ' + escH(code) + '</span>';
                if (examDate) m += '<span>Exam: ' + escH(examDate) + '</span>';
                if (batch) m += '<span>' + escH(batch) + '</span>';
                metaEl.innerHTML = m;

                var cleanCode = code ? code + '_' : '';
                var cleanName = (name || 'doc').replace(/[^a-zA-Z0-9 _\-]/g, '').trim();
                var fn;
                if (matType === 'PYQ') {
                    fn = cleanCode + cleanName + '_PYQ' + (examDate ? '_' + examDate.replace(/[^a-zA-Z0-9 _\-]/g, '') : '') + '.pdf';
                } else if (matType === 'ASSIGNMENT') {
                    fn = (prog ? prog.replace(/[^a-zA-Z0-9 _\-]/g, '') + '_' : '') + cleanName + '_Assignment.pdf';
                } else {
                    fn = cleanCode + cleanName + '_SLM.pdf';
                }

                var dlUrl = '/api/download?url=' + encodeURIComponent(pdfUrl) + '&filename=' + encodeURIComponent(fn);
                dlBtn.href = dlUrl;
                dlBtn.download = fn;
                openBtn.href = pdfUrl;
                var errDl = document.getElementById('errorDownload');
                if (errDl) { errDl.href = dlUrl; errDl.download = fn; }

                var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                var bDl = document.getElementById('bottomDownload');
                if (bDl) {
                    bDl.onclick = function () {
                        if (isIOS) {
                            window.open(pdfUrl, '_blank', 'noopener');
                            var t = document.getElementById('toast');
                            if (t) {
                                t.textContent = "iPhone: Tap Share (\u2191) at bottom and select 'Save to Files'";
                                t.classList.add('visible');
                                setTimeout(function () { t.classList.remove('visible'); }, 4500);
                            }
                        } else {
                            var a = document.createElement('a');
                            a.href = dlUrl;
                            a.download = fn;
                            a.target = '_blank';
                            document.body.appendChild(a);
                            a.click();
                            setTimeout(function () { a.remove(); }, 200);
                        }
                    };
                }

                var bShare = document.getElementById('bottomShare');
                var bCopy = document.getElementById('btnCopyLink');
                function doShare() {
                    var viewUrl = location.href;
                    var text = (name || 'Course PDF') + (code ? ' (' + code + ')' : '') + '\n' + viewUrl;
                    if (navigator.share) {
                        navigator.share({ title: name + ' — SGOU SLM', text: text }).catch(function () { });
                    } else if (navigator.clipboard) {
                        navigator.clipboard.writeText(text).then(function () {
                            var t = document.getElementById('toast');
                            if (t) { t.textContent = 'Link copied to clipboard!'; t.classList.add('visible'); setTimeout(function () { t.classList.remove('visible'); }, 2000); }
                        });
                    }
                }
                if (bShare) bShare.onclick = doShare;
                if (bCopy) bCopy.onclick = doShare;

                loadPDF(pdfUrl);
            }

            // Multi-strategy PDF loader
            var loadTimers = [];

            function loadPDF(url) {
                loadTimers.forEach(function (t) { clearTimeout(t); });
                loadTimers = [];
                frame.onload = null;

                loading.style.display = '';
                loading.innerHTML = '<div class="loading-spinner"></div><span>Loading PDF\u2026</span>';
                frame.style.display = 'none';

                var done = false;
                var step = 0;
                var strategies = [
                    { url: url + '#toolbar=1&navpanes=0', timeout: 3500 }
                ];

                function ready() {
                    if (done) return;
                    done = true;
                    loadTimers.forEach(function (t) { clearTimeout(t); });
                    loadTimers = [];
                    loading.style.display = 'none';
                    frame.style.display = 'block';
                }

                function runStep() {
                    if (step >= strategies.length) {
                        showFallback(url);
                        return;
                    }
                    frame.onload = ready;
                    frame.src = strategies[step].url;
                    var tid = setTimeout(function () {
                        if (!done) { step++; runStep(); }
                    }, strategies[step].timeout);
                    loadTimers.push(tid);
                }

                runStep();
            }

            function showFallback(url) {
                loading.innerHTML =
                    '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                    '<span style="text-align:center;max-width:260px">PDF viewer could not load this file.</span>' +
                    '<div style="display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem">' +
                    '<a href="' + escA(url) + '" download class="btn-view" style="text-decoration:none;padding:.42rem .85rem;font-size:12px">Download</a>' +
                    '<button onclick="location.reload()" class="btn-view" style="padding:.42rem .85rem;font-size:12px;cursor:pointer;background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:5px">Retry</button>' +
                    '<a href="' + escA(url) + '" target="_blank" rel="noopener" class="btn-view" style="text-decoration:none;padding:.42rem .85rem;font-size:12px">New Tab</a>' +
                    '</div>';
            }

            function showError(msg) {
                loading.style.display = 'none';
                errorTxt.textContent = msg;
                errorEl.style.display = 'flex';
            }

            function escH(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            function escA(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

            try { var t = localStorage.getItem('sgou-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (_) { }
        })();
    </script>

</body>
